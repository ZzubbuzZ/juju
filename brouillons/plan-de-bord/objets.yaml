# Objets du bord placés sur le plan de bord (folio 6), phase 2.
#
# Source : feuille Google « Emplacement trucs bateau » (Drive, version lue le 19/10,
# 38 lignes), reprise dans l'ordre de la feuille, et réponses de l'utilisateur aux
# questions PB1 à PB11 du 19/10.
#
# positions : coordonnées du plan (repère de plan_bord.py, avant à droite, bâbord en haut,
# axe à y = 322), une par emplacement, estimées d'après le texte de la feuille.
# trappes : trappes d'accès (repères carrés).
# categorie : securite, gaz, fluides (gazole, eau), moteur, electricite, rangement.
# a_confirmer : la feuille dit « à confirmer avec Julie ».

# bateau : caractéristiques du Gib'Sea 31 (plan Joubert-Nivelt, Gibert Marine), relevées le 20/10
# sur des fiches en ligne (sailboatdata.com, sailingtheweb.com, yachtdatabase.com), non vérifiées
# sur les papiers du bord ; d'où statut: estime. Le tirant d'air n'est donné par aucune fiche (PB12) :
# 12,50 m girouette comprise, donné par l'utilisateur le 20/10, à faire vérifier par Julie.
bateau:
  modele: Gib'Sea 31
  statut: estime
  longueur_hors_tout_m: 9.55
  longueur_flottaison_m: 8.10
  largeur_m: 3.11
  tirant_eau_m: 1.75
  deplacement_kg: 3990
  tirant_air_m: 12.50
  tirant_air_a_confirmer: true     # girouette comprise ; à faire vérifier par Julie
  question_tirant_air: PB12

