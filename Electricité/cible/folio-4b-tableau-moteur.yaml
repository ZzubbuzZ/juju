# Mise en page du folio 4b, lue par outils/folio.py qui produit le SVG voisin.
# Modèle « cible » : chaque fil 12 V du modèle doit figurer sur un folio de cible/ (outils/verifier.py).
# Folio dédié au câblage du tableau moteur (décision du 21/11 : cible uniquement). Faisceau dessiné le 23/11
# d'après le manuel d'atelier Yanmar (schéma 1-22, p. 10-3, tableau de type B), avec le démarrage intégré
# au contacteur à clé (information de l'utilisateur). Intérieur du tableau en traits libres, simplifié.
# Nœuds : {cote, a} (a = coordonnée absolue le long du côté) ; un fil va d'un nœud à l'autre par « trace »
# (points intermédiaires), en segments à 0, 45 ou 90°.
folio: 4b
titre: Tableau moteur
aria: "Tableau moteur Yanmar, installation cible : faisceau entre le moteur (démarreur, alternateur, capteurs) et le tableau (contacteur à clé, voyants, alarme, compte-tours), et horamètre."
desc: "Faisceau du tableau moteur d'après le manuel d'atelier Yanmar (schéma 1-22, tableau de type B), démarrage intégré au contacteur à clé (OFF, ON, START avec rappel sur ON). Voyants et alarme s'allument quand un capteur met leur fil à la masse. Horamètre GH-521S sur le + après contact."
modele: cible
taille: [1200, 720]

