<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Tableau moteur Yanmar, installation cible : faisceau entre le moteur (démarreur, alternateur, capteurs) et le tableau (contacteur à clé, voyants, alarme, compte-tours), et horamètre.">
  <title>Folio 4b · Tableau moteur</title>
  <desc>Faisceau du tableau moteur d&#x27;après le manuel d&#x27;atelier Yanmar (schéma 1-22, tableau de type B), démarrage intégré au contacteur à clé (OFF, ON, START avec rappel sur ON). Voyants et alarme s&#x27;allument quand un capteur met leur fil à la masse. Horamètre GH-521S sur le + après contact.</desc>
