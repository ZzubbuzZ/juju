<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Tableau moteur, installation cible : pour l&#x27;instant seulement l&#x27;horamètre, branché sur le plus après contact du tableau moteur et sur la masse moteur.">
