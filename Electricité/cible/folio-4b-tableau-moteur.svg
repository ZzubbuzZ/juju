  <text class="ts" x="20" y="684">D&#x27;après le manuel d&#x27;atelier Yanmar (schéma 1-22, p. 10-3, tableau de type B), sauf le démarrage, intégré au contacteur à clé. Couleurs d&#x27;origine dans les données ; tout est à vérifier à bord (Q77).</text>
  <text class="ts" x="20" y="702">Pointillés bleus : section non relevée. Intérieur du tableau simplifié : un voyant s&#x27;allume quand son capteur met le fil à la masse. Horamètre : emplacement à relever (Q76).</text>
