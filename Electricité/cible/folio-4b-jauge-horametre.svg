<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Jauge à gasoil et horamètre actuels : la jauge est alimentée depuis le tableau Scheiber par un fusible de 2 ampères, un poussoir et une résistance de 150 ohms, sa masse et celle de la sonde vont au coupe-circuit des négatifs ; l&#x27;horamètre est branché sur le plus après contact du tableau moteur et sur la masse moteur.">
  <title>Folio 4b · Jauge à gasoil et horamètre (cible)</title>
  <desc>Aucune hypothèse retenue ne modifie la jauge à gasoil ni l&#x27;horamètre : ils restent tels que relevés (folio 1b). La résistance de 150 Ω sera retirée et l&#x27;éclairage passé sur le fil jaune (A13) ; le relevé, puis ce folio, seront mis à jour une fois la modification faite à bord.</desc>
