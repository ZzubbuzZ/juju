# Mise en page du folio 4b, lue par outils/folio.py qui produit le SVG voisin.
# Modèle « cible » : chaque fil 12 V du modèle doit figurer sur un folio de cible/ (outils/verifier.py).
# Même dessin que le folio 1b tant qu'aucune hypothèse retenue ne touche ces circuits.
# Nœuds : [côté, coordonnée le long du côté] ; un fil va d'un nœud à l'autre par « trace »
# (points intermédiaires), en segments à 0, 45 ou 90°.
folio: 4b
titre: Jauge à gasoil et horamètre (cible)
aria: "Jauge à gasoil et horamètre actuels : la jauge est alimentée depuis le tableau Scheiber par un fusible de 2 ampères, un poussoir et une résistance de 150 ohms, sa masse et celle de la sonde vont au coupe-circuit des négatifs ; l'horamètre est branché sur le plus après contact du tableau moteur et sur la masse moteur."
desc: "Aucune hypothèse retenue ne modifie la jauge à gasoil ni l'horamètre : ils restent tels que relevés (folio 1b). La résistance de 150 Ω sera retirée et l'éclairage passé sur le fil jaune (A13) ; le relevé, puis ce folio, seront mis à jour une fois la modification faite à bord."
modele: cible
taille: [1200, 700]

