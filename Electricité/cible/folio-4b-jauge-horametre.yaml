    nodes:
      node340: {cote: point, xy: [390, 200], etiquette: [-4, 30, end]}
      node341: {cote: point, xy: [440, 200], etiquette: [4, 30]}
  - id: wago-jauge-2
    x: 476
    y: 220
    w: 56
    h: 26
