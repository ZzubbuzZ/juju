  - id: fus-jauge-gasoil
    forme: fusible
    calibre: 2 A
    titre: porte-fusible
    titre_xy: [245, 178]
    nodes:
      node337: {cote: point, xy: [220, 200], etiquette: [-3, 13, end]}
      node338: {cote: point, xy: [270, 200], etiquette: [3, 13]}
  - id: wago-jauge-1
    x: 296
    y: 220
    w: 56
    h: 26
