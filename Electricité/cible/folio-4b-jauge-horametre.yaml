      node346: {cote: gauche, a: 160, fonction: "+ rouge"}
      node347: {cote: bas, a: 920, fonction: "− bleu"}
      node348: {cote: bas, a: 1080, fonction: "sonde noir"}
  - id: wago-jauge-4
    x: 906
