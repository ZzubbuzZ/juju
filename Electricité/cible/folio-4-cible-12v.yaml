# Mise en page du folio 4, lue par outils/folio.py qui produit le SVG voisin.
# Modèle « cible » : hypothèses de cible/cible.yaml appliquées dans l'ordre. Chaque fil 12 V du modèle
# doit figurer sur ce folio (contrôlé par outils/verifier.py).
# Nœuds : [côté, coordonnée le long du côté] ; un fil va d'un nœud à l'autre par « trace »
# (points intermédiaires), en segments à 0, 45 ou 90°.
folio: 4
titre: Installation 12 V cible
aria: "Installation 12 volts cible : batterie moteur et guindeau, batterie LiFePO4 avec son shunt, chargeur DC/DC Orion XS, chargeur de quai Blue Smart, départs protégés vers les tableaux et l'entrée 12 volts du chauffe-eau."
