  <text class="t" x="592" y="634" data-equipement="groupe-froid">Groupe froid CU-55</text>
  <text class="t" x="592" y="653" data-equipement="eps100">EPS 100 (sous l'évier, à droite)</text>
  <text class="t" x="592" y="672">Prises 230 V : <tspan data-equipement="prise-230-eps100">frigo,</tspan> <tspan data-equipement="prise-230-cuisine">cuisine (tribord)</tspan></text>
  <text class="t" x="592" y="691" data-equipement="eclairage-12v-cuisine">Plafonnier 12 V à LED</text>
  <text class="t" x="592" y="710" data-equipement="eclairage-230-cuisine">Barrette 230 V à 2 spots</text>

  <path class="leader" d="M900 595 L700 420"/>
  <rect class="callout" x="840" y="595" width="200" height="90" rx="2"/>
  <text class="tb" x="852" y="615">Carré</text>
  <text class="t" x="852" y="634" data-equipement="eclairage-12v-carre">Plafonnier 12 V à LED</text>
  <text class="t" x="852" y="653" data-equipement="eclairage-12v-veilleuse-carre">Veilleuse 12 V à LED</text>
  <text class="t" x="852" y="672" data-equipement="eclairage-230-carre">Réglette 230 V à 2 spots</text>

  <path class="leader" d="M361 735 L361 460"/>
  <rect class="callout" x="340" y="735" width="480" height="47" rx="2"/>
  <text class="t" x="352" y="754"><tspan class="tb">Toilette · tribord :</tspan> <tspan data-equipement="boitier-230-tribord">boîtier 230 V, C10 n°2 pour le ballon,</tspan> <tspan data-equipement="prise-230-toilette">prise 230 V</tspan></text>
  <text class="t" x="352" y="773"><tspan data-equipement="eclairage-12v-toilette">Plafonnier 12 V à LED au-dessus de l'évier,</tspan> <tspan data-equipement="eclairage-230-toilette">spot 230 V GU10</tspan></text>

  <text class="ts tn" x="860" y="704">En vert : nouveau (études retenues).</text>
  <text class="ts" x="860" y="720">Déposés : batterie au plomb, coupleur</text>
  <text class="ts" x="860" y="736">Scheiber, coupe-circuit de couplage.</text>
  <text class="ts" x="860" y="752">Câblage : folio 4. Pas à l'échelle.</text>
</svg>
