  <text class="ts" x="1015" y="407">par le 16 A bâbord</text>
  <text class="ts" x="40" y="712">Schéma unifilaire : un trait par câble, les barres obliques donnent le nombre de conducteurs (3 : phase, neutre, terre). Câbles des prises : 3 × 2,5 mm².</text>
  <text class="ts" x="40" y="730">Tous les disjoncteurs coupent la phase et le neutre. Neutre et terre de chaque câble partent des barrettes du boîtier (n209 et n212 à l&#x27;arrivée, n221 et n222 au boîtier tribord).</text>
