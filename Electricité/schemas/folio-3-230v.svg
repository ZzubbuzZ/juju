<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Réseau 230 V en unifilaire : prise de quai, boîtier d&#x27;arrivée avec différentiel 30 mA, chargeur, boîtier de distribution tribord et boîte de dérivation bâbord alimentant prises et éclairage.">
  <title>Folio 3 · Réseau 230 V</title>
  <desc>L&#x27;arrivée (différentiel 30 mA en tête, 10 A pour le chargeur) alimente directement, sans disjoncteur, le boîtier de distribution tribord, dans le cabinet de toilette (A12) : deux 10 A pour l&#x27;éclairage, supposés tribord et bâbord (Q42), 16 A pour les prises tribord, 16 A pour les prises bâbord, qui passent par une simple boîte de dérivation. Tous les disjoncteurs coupent la phase et le neutre. La terre arrive aux prises, au chargeur et au circuit d&#x27;éclairage (le cordon de l&#x27;EPS 100 n&#x27;en a pas), et elle n&#x27;est reliée ni à la masse 12 V ni à un isolateur galvanique (A8). Aux bornes du port de Saint-Chamas, la prise fournit 16 A, soit environ 3 700 W pour tout le bord ; en escale, le calibre est souvent plus faible.</desc>
