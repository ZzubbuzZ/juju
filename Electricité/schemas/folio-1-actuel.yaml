barres:
  # masse commune, sortie du coupe-circuit des négatifs : les fils la rejoignent à 45°, vers node023
  - {node: node023, de: [300, 880], a: [1185, 880]}

incertains:
  - {x: 785, y: 252, w: 255, h: 160, texte: "télécommande : sections à relever (Q59)", texte_xy: [788, 244]}

croisements_admis:
  # Le coupleur est entre le chargeur et le coupe-circuit de couplage, qui relient tous deux le + moteur
  # (node005 / node006) au + servitude (node020) : sa masse, prise côté charges (node023, en bas), doit
  # franchir la ligne du + servitude. Elle ne peut pas passer par un renvoi, node023 étant sur le folio.
  - [wire018, wire008]
  # Pour la même raison, la sortie 2 du chargeur (wire055) franchit wire018 pour rejoindre node020.
  - [wire018, wire055]
  # Le chargeur, entre les deux batteries, rejoint node022 sous la batterie de servitude ; wire003 relie
  # les négatifs des deux batteries (node002 / node008) : l'un des deux doit franchir l'autre.
  - [wire003, wire060]

