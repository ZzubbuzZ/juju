# Mise en page du folio 3 (réseau 230 V du relevé), lue par outils/folio.py qui produit le SVG voisin.
# Unifilaire : un câble = un trait (cables:), ses trois conducteurs cités dans l'étiquette.
# Les nœuds d'un même câble sont au même point de l'appareil (une seule étiquette).
# Le neutre (node509, node521) et la terre (node507, node522) partent des barrettes avec la phase
# de chaque disjoncteur : au départ de chaque câble, une barre de longueur nulle (« point de
# raccordement ») porte ces nœuds, sous le rond du disjoncteur.
folio: 3
titre: Réseau 230 V
aria: "Réseau 230 V en unifilaire : prise de quai, boîtier d'arrivée avec différentiel 30 mA, chargeur, boîtier de distribution tribord et boîte de dérivation bâbord alimentant prises et éclairage."
desc: "L'arrivée (différentiel 30 mA en tête, 10 A pour le chargeur) alimente directement, sans disjoncteur, le boîtier de distribution tribord, dans le cabinet de toilette (A12) : deux 10 A pour l'éclairage, supposés tribord et bâbord (Q42), 16 A pour les prises tribord, 16 A pour les prises bâbord, qui passent par une simple boîte de dérivation. Tous les disjoncteurs coupent la phase et le neutre. La terre arrive aux prises, au chargeur et au circuit d'éclairage (le cordon de l'EPS 100 n'en a pas), et elle n'est reliée ni à la masse 12 V ni à un isolateur galvanique (A8). Aux bornes du port de Saint-Chamas, la prise fournit 16 A, soit environ 3 700 W pour tout le bord ; en escale, le calibre est souvent plus faible."
modele: releve
taille: [1200, 760]

zones:
  - {x: 320, y: 70, w: 380, h: 210, texte: "Boîtier d'arrivée · coffre de cockpit tribord · terre : barrette n507"}
  - {x: 40, y: 322, w: 640, h: 118, texte: "Boîtier de distribution tribord · cabinet de toilette · Legrand DNX3"}
  - {x: 830, y: 330, w: 340, h: 110, texte: "Boîte de dérivation bâbord · table à carte"}

