# yaml-language-server: $schema=../../../outils/schema/donnees.schema.json
#
# D-H1 : différences avec le programme retenu de l'étude A (A-H4, qui cumule A-H2).
# Shunt de 500 A sur le négatif de la batterie de servitude, emplacement b :
# derrière la descente, près du coupe-circuit des négatifs.
# wire010 garde son numéro : seule son extrémité côté coupe-circuit est reprise
# sur le shunt (supprimé puis redéclaré avec sa nouvelle extrémité).
# wire003 de même : relevé sur le − de la batterie de servitude (node008), il passerait
# côté batterie du shunt ; son extrémité est reprise sur le coupe-circuit des négatifs.
# Les deux fils de mesure partent du côté batterie des coupe-circuits, en aval des
# fusibles de 400 A de A-H2 : le moniteur mesure même coupe-circuits ouverts.

hypothese: D-H1
titre: Shunt connecté, lecture sur smartphone
base: A-H4

supprime:
  fils: [wire003, wire010]

equipements:
  - { id: shunt-servitude, type: shunt, designation: "Shunt connecté 500 A de la batterie de servitude (type Victron SmartShunt)", zone: descente, emplacement: "Derrière la platine des coupe-circuits, près du coupe-circuit des négatifs, accessible par l'ouverture côté cabine de poupe", statut: propose }
  - { id: fus-shunt-alim, type: fusible, designation: "Fusible en ligne de l'alimentation du shunt", calibre_A: 1, emplacement: "Sur le fil, contre la borne côté batterie du coupe-circuit de servitude", statut: propose }
  - { id: fus-shunt-aux, type: fusible, designation: "Fusible en ligne de l'entrée auxiliaire (tension de la batterie moteur)", calibre_A: 1, emplacement: "Sur le fil, contre la borne côté batterie du coupe-circuit moteur", statut: propose }

nodes:
  - { id: node011, equipement: shunt-servitude, borne: "− batterie", polarite: "-" }
  - { id: node012, equipement: shunt-servitude, borne: "− système", polarite: "-" }
  - { id: node013, equipement: shunt-servitude, borne: "+ alimentation et mesure (Vbatt+)", polarite: "+" }
  - { id: node014, equipement: shunt-servitude, borne: "entrée auxiliaire (tension batterie moteur)", polarite: "+" }
  - { id: node016, equipement: fus-shunt-alim, borne: "1 (côté source)", polarite: "+" }
  - { id: node017, equipement: fus-shunt-alim, borne: "2", polarite: "+" }
  - { id: node018, equipement: fus-shunt-aux, borne: "1 (côté source)", polarite: "+" }
  - { id: node019, equipement: fus-shunt-aux, borne: "2", polarite: "+" }

fils:
  # --- Négatif de la batterie moteur : ramené côté système du shunt
  - { id: wire003, de: node002, vers: node022, section_mm2: 35, couleur: noir, statut: propose, questions: [Q62], note: "Câble existant, extrémité côté batterie de servitude (node008) reprise sur le coupe-circuit des négatifs ; rallonge ou câble refait selon le trajet (Q60)" }

  # --- Négatif de la batterie de servitude : seul fil côté batterie du shunt
  - { id: wire010, de: node008, vers: node011, section_mm2: 35, couleur: noir, longueur_m: 1, statut: propose, note: "Câble existant, extrémité côté coupe-circuit reprise sur le shunt" }
  - { id: wire011, de: node012, vers: node022, section_mm2: 35, couleur: noir, longueur_m: 0.2, statut: propose, note: "Tout le reste du bord (charges, chargeur, alternateur, batterie moteur) revient par ce fil" }

  # --- Alimentation et mesure de la tension de servitude
  - { id: wire014, de: node020, vers: node016, section_mm2: 0.75, couleur: rouge, longueur_m: 0.1, statut: propose, note: "Aussi court que possible : non protégé" }
  - { id: wire012, de: node017, vers: node013, section_mm2: 0.75, couleur: rouge, longueur_m: 0.5, statut: propose }

  # --- Tension de la batterie moteur (entrée auxiliaire)
  - { id: wire006, de: node005, vers: node018, section_mm2: 0.75, couleur: rouge, longueur_m: 0.1, statut: propose, note: "Aussi court que possible : non protégé" }
  - { id: wire013, de: node019, vers: node014, section_mm2: 0.75, couleur: rouge, longueur_m: 0.5, statut: propose }
