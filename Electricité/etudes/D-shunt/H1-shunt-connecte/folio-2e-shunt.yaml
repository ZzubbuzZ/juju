  - {x: 40, y: 626, classe: ts tu, texte: "Avec l'étude E (décidée le 05/10) : LiFePO4 de 200 Ah, Orion XS et Blue Smart à la place du coupleur et de la sortie 2 du Dolphin ; le démarreur ne traverse plus le shunt."}
  - {x: 40, y: 642, classe: ts tu, texte: "Le shunt est dans la niche de la contremarche, avec l'Orion XS ; le Blue Smart est au coffre de cockpit (folio 2o, E-H5, 14/10)."}
