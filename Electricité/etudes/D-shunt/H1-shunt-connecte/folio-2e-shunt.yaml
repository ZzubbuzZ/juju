# Mise en page du folio 2e, lue par outils/folio.py qui produit le SVG voisin.
# Nœuds : [côté, coordonnée le long du côté] ; un fil va d'un nœud à l'autre par « trace »
# (points intermédiaires), en segments à 0, 45 ou 90°.
folio: 2e
titre: Shunt de la batterie de servitude
aria: "Shunt de 500 A inséré sur le négatif de la batterie de servitude, entre la batterie et le coupe-circuit des négatifs, avec deux fils de mesure protégés par des fusibles de 1 A : tension de servitude et tension de la batterie moteur."
desc: "Le shunt est inséré sur w010, côté coupe-circuit des négatifs : seul le négatif de la batterie de servitude passe de son côté batterie. Deux fils de 0,75 mm², protégés à leur source par un fusible de 1 A, alimentent le shunt et lui donnent la tension de la batterie moteur."
modele: D-H1
taille: [1200, 650]

appareils:
  - id: bat-servitude
    x: 40
    y: 270
    w: 150
    h: 110
    titre: Batterie servitude
    titre_y: 48
    lignes: ["110 Ah · cabine de poupe"]
    nodes:
      node007: [droite, 296]
      node008: [droite, 355]
  - id: fus-bat-servitude
    forme: fusible
    calibre: 400 A
    titre: A-H2
    titre_xy: [288, 186]
    nodes:
      node009: {cote: point, xy: [260, 160], etiquette: [-3, 13, end]}
      node010: {cote: point, xy: [316, 160], etiquette: [3, 13]}
  - id: cc-servitude
    forme: interrupteur
    titre: CC servitude
    titre_xy: [454, 134]
    nodes:
      node020: {cote: point, xy: [424, 160], etiquette: [6, 30]}
      node021: {cote: point, xy: [484, 160], etiquette: [4, 30]}
  - id: fus-shunt-alim
    forme: fusible
    calibre: 1 A
    nodes:
      node016: {cote: point, xy: [460, 230], etiquette: [-3, 22, end]}
      node017: {cote: point, xy: [506, 230], etiquette: [-3, 22, end]}
  - id: fus-shunt-aux
    forme: fusible
    calibre: 1 A
    nodes:
      node019: {cote: point, xy: [700, 230], etiquette: [-3, 22, end]}
      node018: {cote: point, xy: [746, 230], etiquette: [3, 22]}
