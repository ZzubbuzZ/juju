  - {x: 1000, y: 492, texte: "inchangés : hors du shunt"}
  - {x: 40, y: 540, classe: tb, texte: "Ce que mesure le shunt"}
  - {x: 40, y: 560, classe: t, texte: "Tout courant qui entre dans la batterie de servitude ou qui en sort : charges, chargeur de quai, alternateur par le coupleur,"}
  - {x: 40, y: 578, classe: t, texte: "et démarreur quand le coupe-circuit de couplage est fermé (d'où le calibre de 500 A). Les fils de mesure partent du côté batterie"}
