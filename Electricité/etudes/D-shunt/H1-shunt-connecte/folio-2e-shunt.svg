<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-label="Shunt de 500 A inséré sur le négatif de la batterie de servitude, entre la batterie et le coupe-circuit des négatifs, avec deux fils de mesure protégés par des fusibles de 1 A : tension de servitude et tension de la batterie moteur.">
  <title>Folio 2e · Shunt de la batterie de servitude</title>
  <desc>Le shunt est inséré sur wire009, côté coupe-circuit des négatifs : seul le négatif de la batterie de servitude passe de son côté batterie. Deux fils de 0,75 mm², protégés à leur source par un fusible de 1 A, alimentent le shunt et lui donnent la tension de la batterie moteur.</desc>
  <style>
    /* Style autonome : retiré par outils/page.py quand le folio est intégré à la page HTML. */
    svg{--sheet:#fbfcfd;--ink:#18212b;--muted:#5a6776;--pos:#c8231c;--unk:#1f6fbf;--warn:#e58a00;--on-warn:#1a1206;--new:#1d8a4a;--new-soft:#e2f3e8;--zone:#e8edf2;--ph:#8a5a2b;--ne:#2563c4;--pe:#2f9e44;--pey:#e6b800}
    @media (prefers-color-scheme: dark){svg{--sheet:#151b22;--ink:#e3e8ee;--muted:#93a1b0;--pos:#ff5a4f;--unk:#5aa9f5;--warn:#ffa53d;--new:#4fcf85;--new-soft:#15301f;--zone:#1f2832;--ph:#c8915a;--ne:#6aa7ff;--pe:#51cf66;--pey:#ffd43b}}
    .bg{fill:var(--sheet)}
    text{font-family:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",sans-serif;fill:var(--ink)}
    .t{font-size:12.5px}.tb{font-size:13px;font-weight:600}.ts{font-size:11.5px;fill:var(--muted)}
    .id,.idn,.pin{font-family:"IBM Plex Mono",Consolas,monospace}
    .id{font-size:10.5px;fill:var(--muted)}.idn{font-size:10.5px;fill:var(--new)}.pin{font-size:8.5px;fill:var(--ink)}
    .tu{fill:var(--unk)}.tn{fill:var(--new)}.mid{text-anchor:middle}.end{text-anchor:end}
    .p,.n,.u,.lever,.bound,.ph,.ne,.pe,.pey,.leader{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .p{stroke:var(--pos)}.n{stroke:var(--ink)}
    .ph{stroke:var(--ph)}.ne{stroke:var(--ne)}.pe{stroke:var(--pe)}.pey{stroke:var(--pey);stroke-dasharray:6 6;stroke-linecap:butt}
    .u{stroke:var(--unk);stroke-width:1.6;stroke-dasharray:6 4}
    .bound{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 4}
    .w1{stroke-width:1.3}.w2{stroke-width:2}.w3{stroke-width:2.8}.w4{stroke-width:4}.w5{stroke-width:5.5}
    .box{fill:var(--sheet);stroke:var(--ink);stroke-width:1.4}
    .box-new{fill:var(--new-soft);stroke:var(--new);stroke-width:1.6}
    .box-unk{fill:var(--sheet);stroke:var(--unk);stroke-width:1.5;stroke-dasharray:6 4}
    .fuse{fill:var(--sheet);stroke:var(--ink);stroke-width:1.3}
    .fuse-new{fill:var(--new-soft);stroke:var(--new);stroke-width:1.6}
    .dp{fill:var(--pos)}.dn{fill:var(--ink)}
    .term{fill:var(--sheet);stroke:var(--ink);stroke-width:1.4}
    .lever{stroke:var(--ink);stroke-width:2}
    .flag{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
    .flag-new{fill:var(--new-soft);stroke:var(--new);stroke-width:1.4}
    .hull{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
    .zone{fill:var(--zone);stroke:var(--muted);stroke-width:1}
    .zone-pont{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .leader{stroke:var(--muted);stroke-width:1}
    .callout{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
    .mk-a circle{fill:var(--warn)}
    .mk-a text{fill:var(--on-warn);font-family:"IBM Plex Mono",Consolas,monospace;font-size:9.5px;font-weight:500}
    .mk-q circle{fill:var(--sheet);stroke:var(--unk);stroke-width:1.5}
    .mk-q text{fill:var(--unk);font-family:"IBM Plex Mono",Consolas,monospace;font-size:9.5px;font-weight:500}
  </style>
  <rect class="bg" x="0" y="0" width="100%" height="100%"/>

  <!-- ============ Batterie de servitude ============ -->
  <rect class="box" x="40" y="280" width="150" height="100" rx="2"/>
  <text class="tb mid" x="115" y="325">Batterie servitude</text>
  <text class="ts mid" x="115" y="342">110 Ah · cabine de poupe</text>
  <text class="id end" x="184" y="300">node007</text>
  <text class="id end" x="184" y="372">node008</text>

  <!-- + : fusible de 400 A (A-H2) puis coupe-circuit de servitude -->
  <path class="p w4" d="M190 296 H220 V160 H260"/>
  <text class="id" x="226" y="250">wire161 · 35</text>
  <rect class="fuse" x="260" y="151" width="56" height="18"/>
  <text class="id mid" x="288" y="164">400 A</text>
  <text class="ts mid" x="288" y="186">A-H2</text>
  <text class="id mid" x="288" y="200">n072 · n073</text>
  <path class="p w4" d="M316 160 H420"/>
  <text class="id mid" x="370" y="150">wire006 · 35</text>
  <circle class="term" cx="424" cy="160" r="4"/><circle class="term" cx="484" cy="160" r="4"/>
  <path class="lever" d="M424 160 L481 147"/>
  <text class="ts mid" x="454" y="134">CC servitude</text>
  <text class="id end" x="414" y="184">node009</text>
  <path class="p w4" d="M488 160 H540"/>
  <rect class="flag" x="540" y="151" width="170" height="18"/>
  <text class="ts mid" x="625" y="164">charges : folios 1 et 2c</text>

  <!-- Alimentation et mesure du shunt, depuis node009 -->
  <path class="p w1" d="M420 164 V230 H500"/>
  <text class="idn" x="428" y="214">wire181 · 0,75</text>
  <rect class="fuse-new" x="500" y="221" width="46" height="18"/>
  <text class="idn mid" x="523" y="234">1 A</text>
  <text class="idn mid" x="523" y="252">n090 · n091</text>
  <path class="p w1" d="M546 230 H560 V325"/>
  <text class="idn end" x="554" y="292">wire182 · 0,75</text>

  <!-- Tension de la batterie moteur, depuis node003 -->
  <rect class="flag" x="680" y="60" width="240" height="18"/>
  <text class="ts mid" x="800" y="73">CC moteur, côté batterie · node003</text>
  <path class="p w1" d="M800 78 V230 H746"/>
  <text class="idn" x="808" y="160">wire183 · 0,75</text>
  <rect class="fuse-new" x="700" y="221" width="46" height="18"/>
  <text class="idn mid" x="723" y="234">1 A</text>
  <text class="idn mid" x="723" y="252">n092 · n093</text>
  <path class="p w1" d="M700 230 H600 V325"/>
  <text class="idn mid" x="650" y="224">wire184 · 0,75</text>

  <!-- ============ Shunt ============ -->
  <rect class="box-new" x="470" y="325" width="150" height="60" rx="2"/>
  <text class="tb mid tn" x="545" y="352">Shunt 500 A</text>
  <text class="ts mid" x="545" y="369">connecté · Bluetooth</text>
  <text class="idn mid" x="560" y="318">n088</text>
  <text class="idn mid" x="612" y="318">n089</text>
  <text class="idn end" x="464" y="372">n086</text>
  <text class="idn" x="626" y="372">n087</text>

  <!-- − : seul le négatif de la batterie de servitude passe côté batterie du shunt -->
  <path class="n w4" d="M190 355 H470"/>
  <text class="id mid" x="330" y="347">wire009 · 35 (repris)</text>
  <path class="n w4" d="M620 355 H760"/>
  <text class="idn mid" x="690" y="347">wire180 · 35</text>
  <circle class="term" cx="764" cy="355" r="4"/><circle class="term" cx="824" cy="355" r="4"/>
  <path class="lever" d="M764 355 L821 342"/>
  <text class="ts mid" x="794" y="329">CC masse</text>
  <text class="id" x="754" y="378">node005</text>
  <text class="id" x="830" y="375">node006</text>
  <path class="n w4" d="M828 355 H900"/>
  <rect class="flag" x="900" y="346" width="230" height="18"/>
  <text class="ts mid" x="1015" y="359">masse des charges : folio 1</text>
  <path class="n w4" d="M748 355 V430 H866"/>
  <rect class="flag" x="866" y="421" width="324" height="18"/>
  <text class="ts mid" x="1028" y="434">batterie moteur wire004 → n002, chargeur wire005 → n018</text>
  <text class="ts" x="756" y="452">inchangés : hors du shunt</text>

  <!-- ============ Notes ============ -->
  <text class="tb" x="40" y="480">Ce que mesure le shunt</text>
  <text class="t" x="40" y="500">Tout courant qui entre dans la batterie de servitude ou qui en sort : charges, chargeur de quai, alternateur par le coupleur,</text>
  <text class="t" x="40" y="518">et démarreur quand le coupe-circuit de couplage est fermé (d'où le calibre de 500 A). Les fils de mesure partent du côté batterie</text>
  <text class="t" x="40" y="536">des coupe-circuits, après les fusibles de 400 A : la mesure continue coupe-circuits ouverts. Lecture sur smartphone (D-H1).</text>
  <text class="ts tu" x="40" y="566">Avec l'étude E (décidée le 05/10) : LiFePO4 de 200 Ah, Orion XS et Blue Smart à la place du coupleur et de la sortie 2 du Dolphin ; le démarreur ne traverse plus le shunt.</text>
  <text class="ts tu" x="40" y="582">Le shunt va avec le chargeur de quai : dans la contremarche (folio 2i, E-H1) ou dans le coffre de la batterie (folio 2k, E-H4), au choix sur place.</text>
</svg>
