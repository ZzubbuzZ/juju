<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-label="Shunt de 500 A inséré sur le négatif de la batterie de servitude, entre la batterie et le coupe-circuit des négatifs, avec deux fils de mesure protégés par des fusibles de 1 A : tension de servitude et tension de la batterie moteur.">
  <title>Folio 2e · Shunt de la batterie de servitude</title>
  <desc>Le shunt est inséré sur w009, côté coupe-circuit des négatifs : seul le négatif de la batterie de servitude passe de son côté batterie. Deux fils de 0,75 mm², protégés à leur source par un fusible de 1 A, alimentent le shunt et lui donnent la tension de la batterie moteur.</desc>
