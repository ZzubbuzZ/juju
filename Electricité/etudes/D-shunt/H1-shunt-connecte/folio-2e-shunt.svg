  <text class="ts" x="1000" y="476">batterie moteur et chargeur,</text>
  <text class="ts" x="1000" y="492">inchangés : hors du shunt</text>
  <text class="tb" x="40" y="540">Ce que mesure le shunt</text>
  <text class="t" x="40" y="560">Tout courant qui entre dans la batterie de servitude ou qui en sort : charges, chargeur de quai, alternateur par le coupleur,</text>
  <text class="t" x="40" y="578">et démarreur quand le coupe-circuit de couplage est fermé (d&#x27;où le calibre de 500 A). Les fils de mesure partent du côté batterie</text>
  <text class="t" x="40" y="596">des coupe-circuits, après les fusibles de 400 A : la mesure continue coupe-circuits ouverts. Lecture sur smartphone (D-H1).</text>
  <text class="ts tu" x="40" y="626">Avec l&#x27;étude E (décidée le 05/10) : LiFePO4 de 200 Ah, Orion XS et Blue Smart à la place du coupleur et de la sortie 2 du Dolphin ; le démarreur ne traverse plus le shunt.</text>
  <text class="ts tu" x="40" y="642">Le shunt va avec le chargeur de quai : dans la contremarche (folio 2i, E-H1) ou dans le coffre de la batterie (folio 2k, E-H4), au choix sur place.</text>
