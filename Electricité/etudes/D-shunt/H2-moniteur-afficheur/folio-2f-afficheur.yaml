desc: "Le shunt du folio 2e est celui d'un moniteur à afficheur. Le câble de données w185 relie le shunt à l'afficheur, encastré au tableau de servitude à la place de l'indicateur à aiguille, dont le branchement sera vu à la pose ; la place suffit (Q41)."
