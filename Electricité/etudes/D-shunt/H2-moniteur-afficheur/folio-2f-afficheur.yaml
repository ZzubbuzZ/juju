    x: 40
    y: 120
    w: 220
    h: 90
    titre: Shunt 500 A
    lignes: ["du moniteur · descente", "fils de mesure : folio 2e"]
    nodes:
      node094: [droite, 185]
  - id: afficheur-batterie
    x: 730
    y: 120
    w: 190
    h: 90
    titre: Afficheur
    lignes: ["rond, 52 mm, encastré", "alimenté par le câble"]
    nodes:
      node095: [gauche, 185]
