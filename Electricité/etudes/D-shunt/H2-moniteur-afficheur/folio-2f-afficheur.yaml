  - {x: 716, y: 236, texte: "L'afficheur prend la place de l'indicateur (Q28) : découpe à adapter"}
  - {x: 716, y: 254, texte: "au besoin selon le diamètre du trou ; la place suffit (Q41, 03/10)."}
  - {x: 40, y: 300, classe: tb, texte: "Différence avec D-H1"}
  - {x: 40, y: 320, classe: t, texte: "Même shunt, même position, mêmes fils de mesure (folio 2e). Le moniteur ajoute un afficheur fixe, relié au shunt par le câble"}
