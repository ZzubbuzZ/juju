  <text class="t" x="40" y="466">Même SmartShunt, même position, mêmes fils de mesure (folio 2e). Le Cerbo GX lit le shunt par VE.Direct et affiche le bord sur l&#x27;écran.</text>
  <text class="t" x="40" y="484">Il est alimenté après le coupe-circuit de servitude : il s&#x27;éteint bateau coupé, alors que le shunt, alimenté avant, continue de compter.</text>
  <text class="t" x="40" y="502">Le régulateur solaire (étude C) et un futur chargeur Victron se brancheront sur le même Cerbo GX. nXXX = nodeXXX.</text>
