<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-label="Cerbo GX alimenté par un fusible de 3 A après le coupe-circuit de servitude, relié au SmartShunt par un câble VE.Direct et à un écran tactile GX Touch 50 à la table à carte.">
  <title>Folio 2g · Supervision Cerbo GX et écran GX Touch 50</title>
  <desc>Le SmartShunt du folio 2e est lu par un Cerbo GX posé près des coupe-circuits, alimenté côté charges du coupe-circuit de servitude à travers un fusible de 3 A. Le Cerbo GX pilote un écran tactile GX Touch 50 à la table à carte ; leur place reste à relever (Q43).</desc>
  <style>
    /* Style autonome : retiré par outils/page.py quand le folio est intégré à la page HTML. */
    svg{--sheet:#fbfcfd;--ink:#18212b;--muted:#5a6776;--pos:#c8231c;--unk:#1f6fbf;--warn:#e58a00;--on-warn:#1a1206;--new:#1d8a4a;--new-soft:#e2f3e8;--zone:#e8edf2;--ph:#8a5a2b;--ne:#2563c4;--pe:#2f9e44;--pey:#e6b800}
    @media (prefers-color-scheme: dark){svg{--sheet:#151b22;--ink:#e3e8ee;--muted:#93a1b0;--pos:#ff5a4f;--unk:#5aa9f5;--warn:#ffa53d;--new:#4fcf85;--new-soft:#15301f;--zone:#1f2832;--ph:#c8915a;--ne:#6aa7ff;--pe:#51cf66;--pey:#ffd43b}}
    .bg{fill:var(--sheet)}
    text{font-family:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",sans-serif;fill:var(--ink)}
    .t{font-size:12.5px}.tb{font-size:13px;font-weight:600}.ts{font-size:11.5px;fill:var(--muted)}
    .id,.idn,.pin{font-family:"IBM Plex Mono",Consolas,monospace}
    .id{font-size:10.5px;fill:var(--muted)}.idn{font-size:10.5px;fill:var(--new)}.pin{font-size:8.5px;fill:var(--ink)}
    .tu{fill:var(--unk)}.tn{fill:var(--new)}.mid{text-anchor:middle}.end{text-anchor:end}
    .p,.n,.u,.lever,.bound,.ph,.ne,.pe,.pey,.leader{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .p{stroke:var(--pos)}.n{stroke:var(--ink)}
    .ph{stroke:var(--ph)}.ne{stroke:var(--ne)}.pe{stroke:var(--pe)}.pey{stroke:var(--pey);stroke-dasharray:6 6;stroke-linecap:butt}
    .u{stroke:var(--unk);stroke-width:1.6;stroke-dasharray:6 4}
    .bound{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 4}
    .w1{stroke-width:1.3}.w2{stroke-width:2}.w3{stroke-width:2.8}.w4{stroke-width:4}.w5{stroke-width:5.5}
    .box{fill:var(--sheet);stroke:var(--ink);stroke-width:1.4}
    .box-new{fill:var(--new-soft);stroke:var(--new);stroke-width:1.6}
    .box-unk{fill:var(--sheet);stroke:var(--unk);stroke-width:1.5;stroke-dasharray:6 4}
    .fuse{fill:var(--sheet);stroke:var(--ink);stroke-width:1.3}
    .fuse-new{fill:var(--new-soft);stroke:var(--new);stroke-width:1.6}
    .dp{fill:var(--pos)}.dn{fill:var(--ink)}
    .term{fill:var(--sheet);stroke:var(--ink);stroke-width:1.4}
    .lever{stroke:var(--ink);stroke-width:2}
    .flag{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
    .flag-new{fill:var(--new-soft);stroke:var(--new);stroke-width:1.4}
    .hull{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
    .zone{fill:var(--zone);stroke:var(--muted);stroke-width:1}
    .zone-pont{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .leader{stroke:var(--muted);stroke-width:1}
    .callout{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
    .mk-a circle{fill:var(--warn)}
    .mk-a text{fill:var(--on-warn);font-family:"IBM Plex Mono",Consolas,monospace;font-size:9.5px;font-weight:500}
    .mk-q circle{fill:var(--sheet);stroke:var(--unk);stroke-width:1.5}
    .mk-q text{fill:var(--unk);font-family:"IBM Plex Mono",Consolas,monospace;font-size:9.5px;font-weight:500}
  </style>
  <rect class="bg" x="0" y="0" width="100%" height="100%"/>

  <!-- ============ Coupe-circuit de servitude ============ -->
  <path class="p w4" d="M300 120 H420"/>
  <rect class="flag" x="130" y="111" width="170" height="18"/>
  <text class="ts mid" x="215" y="124">batterie, fusible 400 A : folio 2c</text>
  <circle class="term" cx="424" cy="120" r="4"/><circle class="term" cx="484" cy="120" r="4"/>
  <path class="lever" d="M424 120 L481 107"/>
  <text class="ts mid" x="454" y="94">CC servitude</text>
  <text class="id end" x="416" y="142">node009</text>
  <text class="id" x="478" y="142">node010</text>

  <!-- Alimentation du Cerbo GX depuis node010 -->
  <path class="p w1" d="M488 120 H560"/>
  <text class="idn mid" x="524" y="112">wire186 · 0,75</text>
  <rect class="fuse-new" x="560" y="111" width="46" height="18"/>
  <text class="idn mid" x="583" y="124">3 A</text>
  <text class="idn mid" x="583" y="146">n340 · n341</text>
  <path class="p w1" d="M606 120 H700"/>
  <text class="idn mid" x="653" y="112">wire187 · 0,75</text>

  <!-- ============ Cerbo GX ============ -->
  <rect class="box-new" x="700" y="90" width="180" height="100" rx="2"/>
  <text class="tb mid tn" x="790" y="122">Cerbo GX</text>
  <text class="ts mid" x="790" y="140">centrale Victron · descente</text>
  <text class="ts mid" x="790" y="156">≈ 0,3 A allumé</text>
  <text class="idn" x="706" y="106">n342</text>
  <text class="idn" x="706" y="184">n343</text>
  <text class="idn end" x="874" y="184">n344</text>
  <text class="idn end" x="874" y="106">n345</text>

  <!-- Masse du Cerbo GX vers node006 -->
  <path class="n w1" d="M740 190 V260 H540"/>
  <text class="idn" x="748" y="232">wire188 · 0,75</text>
  <rect class="flag" x="330" y="251" width="210" height="18"/>
  <text class="ts mid" x="435" y="264">CC masse, côté charges · node006</text>

  <!-- ============ SmartShunt (D-H1) et VE.Direct ============ -->
  <rect class="box" x="80" y="310" width="190" height="60" rx="2"/>
  <text class="tb mid" x="175" y="334">SmartShunt 500 A</text>
  <text class="ts mid" x="175" y="351">pose et fils de mesure : folio 2e</text>
  <text class="idn" x="276" y="333">n94</text>
  <path class="n w2" d="M270 340 H840 V190"/>
  <text class="idn mid" x="560" y="332">wire189 · câble VE.Direct 1,8 m</text>

  <!-- ============ Table à carte : GX Touch 50 ============ -->
  <rect class="bound" x="930" y="60" width="250" height="200"/>
  <text class="ts" x="940" y="78">Table à carte</text>
  <path class="n w2" d="M880 140 H980"/>
  <text class="idn mid" x="903" y="132">wire190</text>
  <rect class="box-new" x="980" y="100" width="180" height="80" rx="2"/>
  <text class="tb mid tn" x="1070" y="128">GX Touch 50</text>
  <text class="ts mid" x="1070" y="145">écran tactile 5 pouces</text>
  <text class="ts mid" x="1070" y="161">alimenté par le Cerbo GX</text>
  <text class="idn" x="986" y="116">n346</text>
  <text class="ts" x="940" y="206">wire190 : câble de l'écran, 2 m fourni</text>
  <text class="ts" x="940" y="222">et rallonge de 2 m, trajet de wire019</text>

  <!-- ============ Notes ============ -->
  <text class="tb" x="40" y="410">Différence avec D-H1</text>
  <text class="t" x="40" y="430">Même SmartShunt, même position, mêmes fils de mesure (folio 2e). Le Cerbo GX lit le shunt par VE.Direct et affiche le bord sur l'écran.</text>
  <text class="t" x="40" y="448">Il est alimenté après le coupe-circuit de servitude : il s'éteint bateau coupé, alors que le shunt, alimenté avant, continue de compter.</text>
  <text class="t" x="40" y="466">Le régulateur solaire (étude C) et un futur chargeur Victron se brancheront sur le même Cerbo GX. nXXX = nodeXXX.</text>
</svg>
