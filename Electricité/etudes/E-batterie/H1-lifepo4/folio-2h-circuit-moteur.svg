<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-label="Circuit moteur cible : batterie moteur, démarreur, guindeau, Dolphin et Orion XS dans la contremarche.">
  <title>Folio 2h · Circuit moteur cible (Orion XS dans la contremarche)</title>
  <desc>Batterie moteur et ses consommateurs : démarreur et alternateur, guindeau désormais alimenté par le coupe-circuit moteur, Dolphin raccordé au plus près de la batterie, et entrée de l'Orion XS, côté charges du coupe-circuit moteur, avec son fusible de 70 A et sa commande. Orion XS, chargeur de quai et shunt dans la contremarche.</desc>
