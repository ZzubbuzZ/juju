  <text class="idn mid" x="473" y="226">n364 · n365</text>
  <path class="p w3" d="M496 240 H560 V300"/>
  <text class="idn" x="566" y="262">wire203 · 10</text>
  <rect class="box-new" x="520" y="300" width="180" height="90" rx="2"/>
