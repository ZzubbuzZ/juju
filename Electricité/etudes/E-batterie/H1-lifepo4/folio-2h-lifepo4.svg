  <!-- Légende -->
  <text class="ts" x="20" y="702">En vert : nouveau (étude E). Déposés : coupleur Scheiber, coupe-circuit de couplage et leurs câbles ; sortie 2 du Dolphin. Fils de mesure du shunt (wire181 à wire184) : folio 2e.</text>
  <text class="ts" x="20" y="720">Les négatifs de l'Orion XS et du Blue Smart arrivent côté « bord » du shunt : toute la charge de la LiFePO4 est comptée. Variante avec le chargeur et le shunt dans le coffre : folio 2i.</text>
</svg>
