  <text class="id end" x="416" y="540">node009</text>
  <text class="id mid" x="484" y="540">node010</text>
  <path class="p w2" d="M484 524 V570"/>
  <rect class="flag" x="400" y="570" width="200" height="18"/>
  <text class="ts mid" x="500" y="583">charges de servitude : folios 1 et 2c</text>

