  <path class="n w1" d="M1048 92 L1062 86 M1048 98 L1062 92 M1048 104 L1062 98"/>
  <text class="idn end" x="1042" y="92">wire213 · wire214 · wire215</text>
  <text class="ts end" x="1042" y="106">3 × 1,5 · prise ou bornes Wago (Q53)</text>
  <rect class="box-new" x="960" y="120" width="190" height="80" rx="2"/>
  <text class="tb mid tn" x="1055" y="144">Blue Smart IP67 12/17</text>
  <text class="ts mid" x="1055" y="160">chargeur de quai LiFePO4</text>
  <text class="id mid" x="1055" y="178">n372 + · n373 − · n374–376</text>
  <path class="p w2" d="M980 200 V220"/>
  <text class="idn" x="996" y="214">wire211 · 4</text>
  <rect class="fuse-new" x="972" y="220" width="16" height="40"/>
  <text class="idn" x="996" y="244">25 A · n377 · n378</text>
  <path class="p w2" d="M980 260 V290"/>
  <text class="idn" x="996" y="282">wire210 · 4</text>
  <rect class="flag" x="920" y="290" width="100" height="18"/>
