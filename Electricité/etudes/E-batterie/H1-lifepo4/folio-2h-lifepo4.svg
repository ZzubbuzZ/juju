  <path class="p w1" d="M488 520 H620"/>
  <text class="idn" x="530" y="512">wire207</text>
  <rect class="fuse-new" x="620" y="511" width="40" height="18"/>
  <text class="idn mid" x="640" y="524">1 A</text>
  <path class="p w1" d="M660 520 H700"/>
  <text class="idn mid" x="680" y="512">wire208</text>
  <circle class="term" cx="704" cy="520" r="4"/><circle class="term" cx="744" cy="520" r="4"/>
  <path class="lever" d="M704 520 L741 508"/>
