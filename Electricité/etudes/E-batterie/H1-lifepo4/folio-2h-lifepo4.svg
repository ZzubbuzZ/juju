  <text class="id mid" x="254" y="204">400 A</text>
  <text class="ts mid" x="254" y="226">A-H2</text>
  <!-- 30 A sur le goujon d'entrée du 400 A -->
  <path class="p w2" d="M218 196 V170"/>
  <circle class="dp" cx="218" cy="200" r="3.5"/>
  <rect class="fuse-new" x="210" y="130" width="16" height="40"/>
