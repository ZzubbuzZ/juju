  <text class="id mid" x="610" y="358">n360 entrée · n361 sortie</text>
  <text class="id mid" x="610" y="374">n362 − · n363 remote</text>
  <path class="p w3" d="M560 390 V440 H496"/>
  <text class="idn" x="566" y="420">wire205 · 10</text>
  <rect class="fuse-new" x="450" y="431" width="46" height="18"/>
