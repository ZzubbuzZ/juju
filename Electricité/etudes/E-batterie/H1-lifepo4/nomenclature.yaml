# E-H1 : nomenclature chiffrée. Prix TTC en euros du 01/10/2026 : relevés par recherche web
# (pages non ouvertes depuis la session) pour la batterie et le chargeur DC/DC, estimations
# pour le reste. Câbles et fusibles du DC/DC à préciser avec le câblage.

hypothese: E-H1
devise: EUR

lots:
  batterie:
    titre: Batterie LiFePO4 de 200 Ah à la place du plomb (commandée le 05/10)
    note: Place suffisante (Q51). Coupe-circuit de couplage et coupleur Scheiber déposés, sans coût.
  charge:
    titre: Chargeur DC/DC depuis la batterie moteur, à la place du coupleur Scheiber
    note: DC/DC commandé à la main, par un interrupteur près du tableau Scheiber (Q48).
  guindeau:
    titre: Guindeau sur le circuit moteur (décision du 05/10)
    note: Alimenté par la batterie moteur, côté charges du coupe-circuit moteur, au lieu de la servitude.
  secours:
    titre: Démarrage de secours d'une batterie moteur défectueuse (décision du 13/10)
    note: Booster autonome, sans lien entre les deux batteries ; le couplage reste déposé.
  quai:
    titre: Chargeur de quai dédié à la LiFePO4, près de la batterie ; Dolphin conservé pour la batterie moteur seule, raccordé au plus près d'elle
    note: À côté du Dolphin (Q49) ; section du câble 12 V selon la longueur du trajet (Q50).

