# yaml-language-server: $schema=../../../outils/schema/donnees.schema.json
#
# E-H1 : différences avec D-H1 (shunt de servitude posé dans la contremarche, sur le
# programme retenu de l'étude A). Décisions du 02/10 et du 05/10.
# Chargeur de quai LiFePO4 et shunt ensemble, dans la contremarche de la descente
# (emplacement b). La variante « dans le coffre de la batterie », E-H4, est écartée le 14/10 ;
# E-H5 (retenue le 14/10) déplace le chargeur de quai au coffre de cockpit.
# Longueurs estimées, à mesurer à la pose. Orion XS : fusibles de 70 A aux deux extrémités et 16 mm²
# jusqu'à 5 m (notice Victron, § 3.3). Guindeau déplacé sur le circuit moteur (décision du 05/10).

hypothese: E-H1
titre: Batterie LiFePO4, Orion XS et chargeurs dédiés (chargeur de quai dans la contremarche)
base: D-H1

supprime:
  equipements: [bat-servitude, fus-bat-servitude, fus-chargeur-moteur, cc-couplage, coupleur, fus-coupleur-moteur, fus-coupleur-servitude, fus-chargeur-servitude]
  nodes: [node024, node025, node026, node027, node028, node053, node055, node056, node029, node030, node031, node032]
  fils: [wire004, wire051, wire060, wire016, wire055, wire007, wire015, wire018, wire102, wire052, wire057, wire005, wire017]

equipements:
  # --- Batterie et son fusible ---------------------------------------------------
  - { id: bat-servitude, type: batterie, designation: "Batterie de servitude LiFePO4", modele: "Humsienk 12 V 200 Ah Plus, BMS 250 A, Bluetooth", zone: cabine-poupe, emplacement: "Dans le coffre de l'ancienne batterie, sanglée, bornes sous capot", capacite_Ah: 200, statut: propose }
  - { id: fus-bat-servitude, type: fusible, designation: "Fusible de la batterie de servitude (MEGA)", calibre_A: 300, emplacement: "Porte-fusible vissé à côté de la batterie de servitude", statut: propose, note: "300 A au lieu des 400 A de A-H2 : le BMS coupe à 250 A. Décision du 05/10 : MEGA ; un MRBF sur borne aurait un pouvoir de coupure supérieur" }

  # --- Dolphin : sortie moteur au plus près de la batterie moteur ---------------
  - { id: fus-chargeur-moteur, type: fusible, designation: "Fusible du Dolphin, sortie batterie moteur (MIDI)", calibre_A: 30, emplacement: "À la batterie moteur, sur le goujon d'entrée du fusible de 400 A", statut: propose }

  # --- Chargeur DC/DC ------------------------------------------------------------
  - { id: orion-xs, type: chargeur, designation: "Chargeur DC/DC de la LiFePO4", modele: "Victron Orion XS 12/12-50A, réglé vers 15 A", zone: descente, emplacement: "Derrière la platine des coupe-circuits", statut: propose }
  - { id: fus-orion-entree, type: fusible, designation: "Fusible de l'entrée de l'Orion XS (côté moteur, MIDI)", calibre_A: 70, emplacement: "Contre la borne côté charges du coupe-circuit moteur", statut: propose, note: "60 à 70 A d'après la notice Victron (§ 3.3). Côté charges (08/10) : coupe-circuit moteur ouvert, l'Orion XS est isolé de la batterie moteur" }
  - { id: fus-orion-sortie, type: fusible, designation: "Fusible de la sortie de l'Orion XS (côté batterie de servitude, MIDI)", calibre_A: 70, emplacement: "Contre la borne côté batterie du coupe-circuit de servitude", statut: propose, note: "60 à 70 A d'après la notice Victron (§ 3.3) ; la recharge de secours inversée ne dépasse pas 25 A" }
  - { id: fus-orion-remote, type: fusible, designation: "Fusible de la commande de l'Orion XS", calibre_A: 1, emplacement: "À la source du fil, côté charges du coupe-circuit moteur, à côté du fusible d'entrée", statut: propose, note: "Commande prise sur l'entrée de l'Orion XS, comme l'indique la notice (08/10)" }
  - { id: inter-orion, type: interrupteur, designation: "Interrupteur à voyant de l'Orion XS (« ouvrir au port »), entre le + de l'entrée et la broche H (option b de la notice)", zone: descente, emplacement: "Près du tableau Scheiber 2 voies (Q48)", statut: propose }

  # --- Chargeur de quai LiFePO4 --------------------------------------------------
  - { id: chargeur-lifepo4, type: chargeur, designation: "Chargeur de quai de la LiFePO4", modele: "Victron Blue Smart IP67 12/17 (BPC121713006)", zone: descente, emplacement: "Dans la contremarche, avec le shunt (14/10 : déplacé au coffre de cockpit par E-H5)", statut: propose }
  - { id: disj-chargeur-lifepo4, type: disjoncteur, designation: "Disjoncteur du chargeur de quai LiFePO4", modele: "1P+N C10", zone: cockpit-coffre-tribord, emplacement: "Boîtier d'arrivée 230 V, place libre du rail (Q63)", calibre_A: 10, statut: propose, note: "Retenu le 12/10 : le Blue Smart a son propre C10, le Dolphin garde le sien (node310, node311)" }
  - { id: selecteur-guindeau, type: interrupteur, designation: "Sélecteur de batterie du guindeau, 3 positions 1 / OFF / 2, OFF entre 1 et 2 (300 A continu)", zone: descente, emplacement: "Platine des coupe-circuits, en bas à gauche vu de la descente, à la place du coupe-circuit de couplage déposé (15/10)", statut: propose, note: "Commandé le 13/10 : 300 A en continu, IP66, goujons M10. OFF entre 1 et 2 : pas de liaison entre les batteries au passage (à contrôler au multimètre à réception, aucune continuité entre 1 et 2 en tournant). Basculer guindeau à l'arrêt. Position normale : 1 (moteur) ; 2 : secours" }
  - { id: fus-chargeur-lifepo4, type: fusible, designation: "Fusible de la sortie du chargeur de quai LiFePO4", calibre_A: 25, emplacement: "Contre la borne côté batterie du coupe-circuit de servitude", statut: propose, note: "Calibre à confirmer sur la notice du Blue Smart" }

nodes:
  # --- Dolphin --------------------------------------------------------------------
  - { id: node053, equipement: fus-chargeur-moteur, borne: "1 (côté batterie)", polarite: "+", monte_sur: node003 }

  # --- Orion XS -------------------------------------------------------------------
  - { id: node061, equipement: orion-xs, borne: "entrée +", polarite: "+" }
  - { id: node062, equipement: orion-xs, borne: "sortie +", polarite: "+" }
  - { id: node063, equipement: orion-xs, borne: "−", polarite: "-" }
  - { id: node064, equipement: orion-xs, borne: "remote H", polarite: commande }
  - { id: node065, equipement: fus-orion-entree, borne: "1 (côté source)", polarite: "+" }
  - { id: node066, equipement: fus-orion-entree, borne: "2", polarite: "+" }
  - { id: node067, equipement: fus-orion-sortie, borne: "1 (côté batterie)", polarite: "+" }
  - { id: node068, equipement: fus-orion-sortie, borne: "2", polarite: "+" }
  - { id: node069, equipement: fus-orion-remote, borne: "1 (côté source)", polarite: "+" }
  - { id: node070, equipement: fus-orion-remote, borne: "2", polarite: "+" }
  - { id: node071, equipement: inter-orion, borne: "entrée", polarite: "+" }
  - { id: node072, equipement: inter-orion, borne: "sortie", polarite: commande }
  - { id: node073, equipement: inter-orion, borne: "masse du voyant", polarite: "-" }

  # --- Chargeur de quai LiFePO4 ------------------------------------------------------
  - { id: node057, equipement: chargeur-lifepo4, borne: "sortie +", polarite: "+" }
  - { id: node058, equipement: chargeur-lifepo4, borne: "sortie −", polarite: "-" }
  - { id: node317, equipement: chargeur-lifepo4, borne: "230 V phase", polarite: 230V-phase }
  - { id: node318, equipement: chargeur-lifepo4, borne: "230 V neutre", polarite: 230V-neutre }
  - { id: node319, equipement: chargeur-lifepo4, borne: "230 V terre", polarite: 230V-terre }
  - { id: node059, equipement: fus-chargeur-lifepo4, borne: "1 (côté batterie)", polarite: "+" }
  - { id: node060, equipement: fus-chargeur-lifepo4, borne: "2", polarite: "+" }
  - { id: node315, equipement: disj-chargeur-lifepo4, borne: "entrée", polarite: 230V-phase }
  - { id: node316, equipement: disj-chargeur-lifepo4, borne: "sortie", polarite: 230V-phase }
  - { id: node105, equipement: selecteur-guindeau, borne: "1 (batterie moteur)", polarite: "+" }
  - { id: node106, equipement: selecteur-guindeau, borne: "2 (batterie de servitude)", polarite: "+" }
  - { id: node107, equipement: selecteur-guindeau, borne: "commun (vers le guindeau)", polarite: commute }

fils:
  # --- Dolphin, au plus près de la batterie moteur ------------------------------------
  - { id: wire063, de: node054, vers: node050, section_mm2: 6, couleur: rouge, longueur_m: 0.5, remplace: wire051, statut: propose, note: "Le Dolphin est juste au-dessus de la batterie moteur" }
  - { id: wire050, de: node052, vers: node002, section_mm2: 6, couleur: noir, longueur_m: 0.5, remplace: wire060, statut: propose, note: "Négatif du Dolphin sur la borne − de la batterie moteur" }

  # --- Orion XS -------------------------------------------------------------------------
  - { id: wire053, de: node006, vers: node065, section_mm2: 16, couleur: rouge, longueur_m: 0.15, statut: propose, note: "Côté charges du coupe-circuit moteur (08/10). Aussi court que possible : non protégé" }
  - { id: wire065, de: node066, vers: node061, section_mm2: 16, couleur: rouge, longueur_m: 0.5, statut: propose, note: "16 mm² jusqu'à 5 m, d'après la notice (fusible de 60 à 70 A)" }
  - { id: wire058, de: node020, vers: node067, section_mm2: 16, couleur: rouge, longueur_m: 0.15, statut: propose, note: "Aussi court que possible : non protégé" }
  - { id: wire066, de: node068, vers: node062, section_mm2: 16, couleur: rouge, longueur_m: 0.5, statut: propose }
  - { id: wire062, de: node063, vers: node022, section_mm2: 16, couleur: noir, longueur_m: 0.5, statut: propose, note: "Côté « bord » du shunt : la charge de la LiFePO4 est comptée" }
  - { id: wire054, de: node006, vers: node069, section_mm2: 0.75, couleur: rouge, longueur_m: 0.1, statut: propose, note: "+ de l'entrée de l'Orion XS, côté charges du coupe-circuit moteur (notice, 08/10)" }
  - { id: wire068, de: node070, vers: node071, section_mm2: 0.75, couleur: rouge, longueur_m: 0.5, statut: propose }
  - { id: wire067, de: node072, vers: node064, section_mm2: 0.75, couleur: rouge, longueur_m: 0.5, statut: propose, note: "Commande « remote » de l'Orion XS : + commuté sur la broche H, actif au-dessus de 4 V ; cavalier H-L d'origine retiré" }
  - { id: wire061, de: node073, vers: node022, section_mm2: 0.75, couleur: noir, longueur_m: 0.5, statut: propose, note: "Masse du voyant sur le coupe-circuit des négatifs, côté batteries (08/10)" }

  # --- Guindeau sur le circuit moteur (05/10) ----------------------------------------------
  - { id: wire101, de: node006, vers: node105, section_mm2: 35, couleur: rouge, longueur_m: 0.5, remplace: wire102, statut: propose, note: "Le guindeau est alimenté par la batterie moteur, côté charges du coupe-circuit moteur, au lieu de la servitude Arrive au sélecteur du guindeau, position 1 (13/10)." }
  - { id: wire103, de: node021, vers: node106, section_mm2: 35, couleur: rouge, longueur_m: 0.5, statut: propose, note: "Secours du guindeau par la LiFePO4 (13/10), position 2 du sélecteur ; protégé par le MEGA de 300 A" }
  - { id: wire108, de: node107, vers: node108, section_mm2: 35, couleur: rouge, longueur_m: 0.3, statut: propose, note: "Commun du sélecteur vers le disjoncteur du guindeau" }

  # --- Chargeur de quai LiFePO4 : 12 V ---------------------------------------------------
  - { id: wire056, de: node020, vers: node059, section_mm2: 4, couleur: rouge, longueur_m: 0.15, statut: propose, note: "Aussi court que possible : non protégé" }
  - { id: wire064, de: node060, vers: node057, section_mm2: 4, couleur: rouge, longueur_m: 0.5, statut: propose }
  - { id: wire059, de: node058, vers: node022, section_mm2: 4, couleur: noir, longueur_m: 0.5, statut: propose, note: "Côté « bord » du shunt : la charge est comptée" }

  # --- Chargeur de quai LiFePO4 : 230 V depuis son propre C10 (12/10, Q63) et un câble dédié (Q53) ---
  - { id: wire315, de: node308, vers: node315, statut: propose, note: "Câblage interne du boîtier d'arrivée, depuis la sortie phase du différentiel, comme wire314" }
  - { id: wire311, de: node316, vers: node317, section_mm2: 1.5, couleur: marron, longueur_m: 4, statut: propose, note: "Câble 3 × 1,5 mm² dédié, jusqu'à une prise ou un boîtier à bornes Wago près du chargeur (Q53) ; longueur estimée" }
  - { id: wire312, de: node309, vers: node318, section_mm2: 1.5, couleur: bleu, longueur_m: 4, statut: propose }
  - { id: wire313, de: node307, vers: node319, section_mm2: 1.5, couleur: vert-jaune, longueur_m: 4, statut: propose }
