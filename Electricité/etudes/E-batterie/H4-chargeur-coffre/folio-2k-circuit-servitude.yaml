# Mise en page du folio 2k, lue par outils/folio.py qui produit le SVG voisin.
# Nœuds : [côté, coordonnée le long du côté] ; un fil va d'un nœud à l'autre par « trace »
# (points intermédiaires), en segments à 0, 45 ou 90°.
# Disposition sans croisement : le Blue Smart à gauche (son − descend par le bord du coffre),
# l'Orion XS entre lui et la batterie, le shunt en bas ; node012 reçoit les trois négatifs
# sur son côté gauche (w059 à l'horizontale, w062 d'en haut, w011 repart vers le bas).
