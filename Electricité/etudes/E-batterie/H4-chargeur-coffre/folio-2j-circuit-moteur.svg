<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Circuit moteur cible, variante : Orion XS dans le coffre de la batterie de servitude.">
  <title>Folio 2j · Circuit moteur cible (Orion XS dans le coffre de la batterie)</title>
  <desc>Batterie moteur et ses consommateurs : démarreur et alternateur, guindeau désormais alimenté par le coupe-circuit moteur, Dolphin raccordé au plus près de la batterie, et entrée de l&#x27;Orion XS avec son fusible de 70 A. Variante : l&#x27;Orion XS est dans le coffre de la batterie de servitude.</desc>
