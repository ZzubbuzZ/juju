<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Variante : le shunt et le chargeur de quai LiFePO4 sont posés dans le coffre de la batterie de servitude ; renvois vers la platine des coupe-circuits.">
  <title>Folio 2i · Variante, chargeur de quai et shunt dans le coffre de la batterie</title>
  <desc>Le shunt et le Blue Smart sont posés dans le coffre de la LiFePO4 : wire009 devient très court et wire180 remonte à la platine ; le chargeur se branche sur la borne + de la batterie, et son alimentation 230 V fait le trajet depuis le disjoncteur du chargeur.</desc>
  <style>
    /* Style autonome : retiré par outils/page.py quand le folio est intégré à la page HTML. */
    svg{--sheet:#fbfcfd;--ink:#18212b;--muted:#5a6776;--pos:#c8231c;--unk:#1f6fbf;--warn:#e58a00;--on-warn:#1a1206;--new:#1d8a4a;--new-soft:#e2f3e8;--zone:#e8edf2;--ph:#8a5a2b;--ne:#2563c4;--pe:#2f9e44;--pey:#e6b800}
    @media (prefers-color-scheme: dark){svg{--sheet:#151b22;--ink:#e3e8ee;--muted:#93a1b0;--pos:#ff5a4f;--unk:#5aa9f5;--warn:#ffa53d;--new:#4fcf85;--new-soft:#15301f;--zone:#1f2832;--ph:#c8915a;--ne:#6aa7ff;--pe:#51cf66;--pey:#ffd43b}}
    .bg{fill:var(--sheet)}
    text{font-family:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",sans-serif;fill:var(--ink)}
    .t{font-size:12.5px}.tb{font-size:13px;font-weight:600}.ts{font-size:11.5px;fill:var(--muted)}
    .id,.idn,.pin{font-family:"IBM Plex Mono",Consolas,monospace}
    .id{font-size:10.5px;fill:var(--muted)}.idn{font-size:10.5px;fill:var(--new)}.pin{font-size:8.5px;fill:var(--ink)}
    .tu{fill:var(--unk)}.tn{fill:var(--new)}.mid{text-anchor:middle}.end{text-anchor:end}
    .p,.n,.u,.lever,.bound,.ph,.ne,.pe,.pey,.leader{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .p{stroke:var(--pos)}.n{stroke:var(--ink)}
    .ph{stroke:var(--ph)}.ne{stroke:var(--ne)}.pe{stroke:var(--pe)}.pey{stroke:var(--pey);stroke-dasharray:6 6;stroke-linecap:butt}
    .u{stroke:var(--unk);stroke-width:1.6;stroke-dasharray:6 4}
    .bound{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 4}
    .w1{stroke-width:1.3}.w2{stroke-width:2}.w3{stroke-width:2.8}.w4{stroke-width:4}.w5{stroke-width:5.5}
    .box{fill:var(--sheet);stroke:var(--ink);stroke-width:1.4}
    .box-new{fill:var(--new-soft);stroke:var(--new);stroke-width:1.6}
    .box-unk{fill:var(--sheet);stroke:var(--unk);stroke-width:1.5;stroke-dasharray:6 4}
    .fuse{fill:var(--sheet);stroke:var(--ink);stroke-width:1.3}
    .fuse-new{fill:var(--new-soft);stroke:var(--new);stroke-width:1.6}
    .dp{fill:var(--pos)}.dn{fill:var(--ink)}
    .term{fill:var(--sheet);stroke:var(--ink);stroke-width:1.4}
    .lever{stroke:var(--ink);stroke-width:2}
    .flag{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
    .flag-new{fill:var(--new-soft);stroke:var(--new);stroke-width:1.4}
    .hull{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
    .zone{fill:var(--zone);stroke:var(--muted);stroke-width:1}
    .zone-pont{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .leader{stroke:var(--muted);stroke-width:1}
    .callout{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
    .mk-a circle{fill:var(--warn)}
    .mk-a text{fill:var(--on-warn);font-family:"IBM Plex Mono",Consolas,monospace;font-size:9.5px;font-weight:500}
    .mk-q circle{fill:var(--sheet);stroke:var(--unk);stroke-width:1.5}
    .mk-q text{fill:var(--unk);font-family:"IBM Plex Mono",Consolas,monospace;font-size:9.5px;font-weight:500}
  </style>
  <rect class="bg" x="0" y="0" width="100%" height="100%"/>

  <!-- ============ Zones ============ -->
  <rect class="bound" x="20" y="40" width="760" height="440"/>
  <text class="ts" x="30" y="58">Coffre de la cabine de poupe : batterie, shunt et chargeur de quai</text>
  <rect class="bound" x="810" y="40" width="370" height="440"/>
  <text class="ts" x="820" y="58">Contremarche de la descente (folio 2h)</text>

  <!-- ============ LiFePO4 et fusible ============ -->
  <rect class="box-new" x="60" y="200" width="200" height="70" rx="2"/>
  <text class="tb mid tn" x="160" y="223">LiFePO4 200 Ah</text>
  <text class="ts mid" x="160" y="239">Humsienk · BMS 250 A</text>
  <text class="id mid" x="160" y="258">node007 (+) · node008 (−)</text>
  <path class="p w4" d="M260 215 H300"/>
  <circle class="dp" cx="275" cy="215" r="3.5"/>
  <rect class="fuse-new" x="300" y="206" width="44" height="18"/>
  <text class="idn mid" x="322" y="219">300 A</text>
  <text class="ts mid tn" x="322" y="241">MEGA · E-H1</text>
  <path class="p w4" d="M344 215 H880"/>
  <text class="id mid" x="760" y="207">wire006 · 35</text>
  <rect class="flag" x="880" y="206" width="210" height="18"/>
  <text class="ts mid" x="985" y="219">→ node009 (CC servitude, côté batterie)</text>

  <!-- ============ Chargeur de quai, pris sur la borne + ============ -->
  <path class="p w2" d="M275 211 V160"/>
  <text class="idn" x="283" y="190">wire210 · 4 · sur la borne +</text>
  <rect class="fuse-new" x="267" y="120" width="16" height="40"/>
  <text class="idn" x="291" y="144">25 A · n377 · n378</text>
  <path class="p w2" d="M275 120 V95 H420"/>
  <text class="idn mid" x="350" y="89">wire211 · 4</text>
  <rect class="box-new" x="420" y="70" width="200" height="70" rx="2"/>
  <text class="tb mid tn" x="520" y="93">Blue Smart IP67 12/17</text>
  <text class="ts mid" x="520" y="109">chargeur de quai LiFePO4</text>
  <text class="id mid" x="520" y="128">n372 + · n373 − · n374–376</text>
  <path class="n w2" d="M620 105 H880"/>
  <path class="n w1" d="M744 112 L752 98 M749 112 L757 98 M754 112 L762 98"/>
  <text class="idn mid" x="750" y="90">wire213 · wire214 · wire215</text>
  <text class="ts mid" x="720" y="128">3 × 1,5 · environ 6 m (Q50, Q53)</text>
  <rect class="flag" x="880" y="96" width="210" height="18"/>
  <text class="ts mid" x="985" y="109">disjoncteur du chargeur C10 · folio 3</text>
  <path class="n w2" d="M580 140 V285 H500 V300"/>
  <text class="idn" x="588" y="178">wire212 · 4</text>

  <!-- ============ Shunt dans le coffre ============ -->
  <path class="n w4" d="M260 255 H300 V322 H380"/>
  <text class="idn" x="250" y="345">wire009 · 35 · 0,2 m</text>
  <rect class="box" x="380" y="300" width="140" height="44" rx="2"/>
  <text class="tb mid" x="450" y="319">Shunt 500 A</text>
  <text class="ts mid" x="450" y="335">D-H1 · node086 / 087</text>
  <path class="n w4" d="M520 322 H880"/>
  <text class="idn mid" x="700" y="314">wire180 · 35 · 1 m</text>
  <rect class="flag" x="880" y="313" width="210" height="18"/>
  <text class="ts mid" x="985" y="326">→ node005 (CC masse, côté batteries)</text>
  <path class="p w1" d="M420 344 V400 H880"/>
  <text class="idn mid" x="650" y="394">wire182 · 0,75 · 1,2 m</text>
  <rect class="flag" x="880" y="391" width="210" height="18"/>
  <text class="ts mid" x="985" y="404">→ fusible 1 A, n91 (alimentation)</text>
  <path class="p w1" d="M480 344 V440 H880"/>
  <text class="idn mid" x="650" y="434">wire184 · 0,75 · 1,2 m</text>
  <rect class="flag" x="880" y="431" width="210" height="18"/>
  <text class="ts mid" x="985" y="444">→ fusible 1 A, n93 (batterie moteur)</text>

  <!-- Légende -->
  <text class="ts" x="20" y="506">Variante de E-H1 : seuls changent l'emplacement du shunt et du chargeur de quai, les longueurs et les points de raccordement ; numéros inchangés.</text>
  <text class="ts" x="20" y="524">Le chargeur se branche sur la borne + de la batterie, avant le fusible de 300 A : la charge reste possible coupe-circuit ouvert. Son négatif rejoint le côté « bord » du shunt.</text>
  <text class="ts" x="20" y="542">Le reste (Orion XS, Dolphin, interrupteur de commande) est inchangé : folio 2h.</text>
</svg>
