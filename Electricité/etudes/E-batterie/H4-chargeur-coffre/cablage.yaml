# yaml-language-server: $schema=../../../outils/schema/donnees.schema.json
#
# E-H4 : variante de E-H1. L'Orion XS, le chargeur de quai LiFePO4 et le shunt de l'étude D
# vont dans le coffre de la batterie de servitude (emplacement a de l'étude D) au lieu de la
# contremarche. Seuls changent les longueurs et les points de raccordement ; les numéros
# des fils et des nœuds sont ceux de E-H1 et de D-H1. Choix sur place (Q53, 05/10).

hypothese: E-H4
titre: Variante de E-H1, Orion XS, chargeur de quai et shunt dans le coffre de la batterie
base: E-H1

supprime:
  equipements: [shunt-servitude, chargeur-lifepo4, fus-chargeur-lifepo4, orion-xs, fus-orion-sortie]
  fils: [wire010, wire011, wire012, wire013, wire065, wire058, wire062, wire067, wire056, wire059, wire311, wire312, wire313]

equipements:
  - { id: shunt-servitude, type: shunt, designation: "Shunt connecté 500 A de la batterie de servitude (type Victron SmartShunt)", zone: cabine-poupe, emplacement: "Dans le coffre de la batterie de servitude, contre la paroi", statut: propose }
  - { id: chargeur-lifepo4, type: chargeur, designation: "Chargeur de quai de la LiFePO4", modele: "Victron Blue Smart IP67 12/17 (BPC121713006)", zone: cabine-poupe, emplacement: "Dans le coffre de la batterie, sur une paroi, avec un peu d'air autour", statut: propose }
  - { id: orion-xs, type: chargeur, designation: "Chargeur DC/DC de la LiFePO4", modele: "Victron Orion XS 12/12-50A, réglé vers 15 A", zone: cabine-poupe, emplacement: "Dans le coffre de la batterie de servitude", statut: propose }
  - { id: fus-orion-sortie, type: fusible, designation: "Fusible de la sortie de l'Orion XS (côté batterie de servitude, MIDI)", calibre_A: 70, emplacement: "À la borne + de la batterie de servitude, du côté batterie du fusible de 300 A", statut: propose }
  - { id: fus-chargeur-lifepo4, type: fusible, designation: "Fusible de la sortie du chargeur de quai LiFePO4", calibre_A: 25, emplacement: "À la borne + de la batterie de servitude, du côté batterie du fusible de 300 A", statut: propose, note: "Calibre à confirmer sur la notice du Blue Smart" }

fils:
  # --- Shunt dans le coffre : wire010 court, wire011 remonte à la platine ----------------
  - { id: wire010, de: node008, vers: node011, section_mm2: 35, couleur: noir, longueur_m: 0.2, statut: propose, note: "Câble existant raccourci, ou refait court" }
  - { id: wire011, de: node012, vers: node022, section_mm2: 35, couleur: noir, longueur_m: 1, statut: propose, note: "Du shunt, dans le coffre, au coupe-circuit des négatifs : reprend le trajet de l'ancien wire010" }
  - { id: wire012, de: node017, vers: node013, section_mm2: 0.75, couleur: rouge, longueur_m: 1.2, statut: propose }
  - { id: wire013, de: node019, vers: node014, section_mm2: 0.75, couleur: rouge, longueur_m: 1.2, statut: propose }

  # --- Chargeur de quai dans le coffre ------------------------------------------------------
  - { id: wire056, de: node007, vers: node059, section_mm2: 4, couleur: rouge, longueur_m: 0.15, statut: propose, note: "Sur la borne + de la batterie : la charge reste possible coupe-circuit ouvert" }
  - { id: wire059, de: node058, vers: node012, section_mm2: 4, couleur: noir, longueur_m: 0.3, statut: propose, note: "Côté « bord » du shunt, dans le coffre" }
  - { id: wire311, de: node316, vers: node317, section_mm2: 1.5, couleur: marron, longueur_m: 6, statut: propose, note: "Câble 3 × 1,5 mm² dédié jusqu'au coffre de la batterie (environ 5 m, Q50), prise ou boîtier à bornes Wago (Q53)" }
  - { id: wire312, de: node309, vers: node318, section_mm2: 1.5, couleur: bleu, longueur_m: 6, statut: propose }
  - { id: wire313, de: node307, vers: node319, section_mm2: 1.5, couleur: vert-jaune, longueur_m: 6, statut: propose }

  # --- Orion XS dans le coffre -----------------------------------------------------------------
  - { id: wire065, de: node066, vers: node061, section_mm2: 16, couleur: rouge, longueur_m: 1.5, statut: propose, note: "Du fusible de 70 A de la platine (côté moteur) jusqu'au coffre" }
  - { id: wire058, de: node007, vers: node067, section_mm2: 16, couleur: rouge, longueur_m: 0.15, statut: propose, note: "Sur la borne + de la batterie de servitude" }
  - { id: wire062, de: node063, vers: node012, section_mm2: 16, couleur: noir, longueur_m: 0.3, statut: propose, note: "Côté « bord » du shunt, dans le coffre" }
  - { id: wire067, de: node072, vers: node064, section_mm2: 0.75, couleur: rouge, longueur_m: 2, statut: propose, note: "Commande « remote » : de l'interrupteur, près du tableau Scheiber, jusqu'au coffre" }
