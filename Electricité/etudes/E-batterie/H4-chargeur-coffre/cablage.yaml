# yaml-language-server: $schema=../../../outils/schema/donnees.schema.json
#
# E-H4 : variante de E-H1. Le chargeur de quai LiFePO4 et le shunt de l'étude D vont
# dans le coffre de la batterie de servitude (emplacement a de l'étude D) au lieu de la
# contremarche. Seuls changent les longueurs et les points de raccordement ; les numéros
# des fils et des nœuds sont ceux de E-H1 et de D-H1. Choix sur place (Q53, 05/10).

hypothese: E-H4
titre: Variante de E-H1, chargeur de quai et shunt dans le coffre de la batterie
base: E-H1

supprime:
  equipements: [shunt-servitude, chargeur-lifepo4, fus-chargeur-lifepo4]
  fils: [wire009, wire180, wire182, wire184, wire210, wire212, wire213, wire214, wire215]

equipements:
  - { id: shunt-servitude, type: shunt, designation: "Shunt connecté 500 A de la batterie de servitude (type Victron SmartShunt)", zone: cabine-poupe, emplacement: "Dans le coffre de la batterie de servitude, contre la paroi", statut: propose }
  - { id: chargeur-lifepo4, type: chargeur, designation: "Chargeur de quai de la LiFePO4", modele: "Victron Blue Smart IP67 12/17 (BPC121713006)", zone: cabine-poupe, emplacement: "Dans le coffre de la batterie, sur une paroi, avec un peu d'air autour", statut: propose }
  - { id: fus-chargeur-lifepo4, type: fusible, designation: "Fusible de la sortie du chargeur de quai LiFePO4", calibre_A: 25, emplacement: "À la borne + de la batterie de servitude, du côté batterie du fusible de 300 A", statut: propose, note: "Calibre à confirmer sur la notice du Blue Smart" }

fils:
  # --- Shunt dans le coffre : wire009 court, wire180 remonte à la platine ----------------
  - { id: wire009, de: node008, vers: node086, section_mm2: 35, couleur: noir, longueur_m: 0.2, statut: propose, note: "Câble existant raccourci, ou refait court" }
  - { id: wire180, de: node087, vers: node005, section_mm2: 35, couleur: noir, longueur_m: 1, statut: propose, note: "Du shunt, dans le coffre, au coupe-circuit des négatifs : reprend le trajet de l'ancien wire009" }
  - { id: wire182, de: node091, vers: node088, section_mm2: 0.75, couleur: rouge, longueur_m: 1.2, statut: propose }
  - { id: wire184, de: node093, vers: node089, section_mm2: 0.75, couleur: rouge, longueur_m: 1.2, statut: propose }

  # --- Chargeur de quai dans le coffre ------------------------------------------------------
  - { id: wire210, de: node007, vers: node377, section_mm2: 4, couleur: rouge, longueur_m: 0.15, statut: propose, note: "Sur la borne + de la batterie : la charge reste possible coupe-circuit ouvert" }
  - { id: wire212, de: node373, vers: node087, section_mm2: 4, couleur: noir, longueur_m: 0.3, statut: propose, note: "Côté « bord » du shunt, dans le coffre" }
  - { id: wire213, de: node211, vers: node374, section_mm2: 1.5, couleur: marron, longueur_m: 6, statut: propose, note: "Câble 3 × 1,5 mm² dédié jusqu'au coffre de la batterie (environ 5 m, Q50), prise ou boîtier à bornes Wago (Q53)" }
  - { id: wire214, de: node209, vers: node375, section_mm2: 1.5, couleur: bleu, longueur_m: 6, statut: propose }
  - { id: wire215, de: node212, vers: node376, section_mm2: 1.5, couleur: vert-jaune, longueur_m: 6, statut: propose }
