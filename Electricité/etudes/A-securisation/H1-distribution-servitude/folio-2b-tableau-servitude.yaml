# Mise en page du folio 2b, lue par outils/folio.py qui produit le SVG voisin.
# Le détail interne du tableau (barre +, fusibles et interrupteurs de chaque circuit) n'est pas dans les
# données : il est dessiné par des traits libres ; les sorties node102-113 sont les bornes du tableau.
folio: 2b
titre: Tableau de la table à carte, 12 circuits
aria: "Schéma en échelle des 12 circuits du tableau de servitude : pour chaque circuit, fusible, interrupteur, fil positif, récepteur et fil de masse dédié vers la barre négative du tableau. Les trois feux du mât passent par un connecteur de pied de mât à six broches."
desc: "Un fusible et un interrupteur par circuit, comme sur le tableau actuel. Chaque récepteur renvoie sa masse par son propre fil. Les trois feux du mât passent par un connecteur de pont à 6 broches (b1 à b6), sans masse commune."
modele: A-H1
taille: [1200, 810]

