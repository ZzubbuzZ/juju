      node010: {cote: point, xy: [360, 130], etiquette: [4, 20]}
  - id: fus-pompe-cale
    forme: fusible
    calibre: 3 A
    nodes:
      node065: {cote: point, xy: [284, 196], etiquette: [12, 4]}
      node066: {cote: point, xy: [284, 236], etiquette: [12, 4]}

