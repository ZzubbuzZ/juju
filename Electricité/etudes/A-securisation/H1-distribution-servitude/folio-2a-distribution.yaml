# Mise en page du folio 2a, lue par outils/folio.py qui produit le SVG voisin.
# Nœuds : [côté, coordonnée le long du côté] ; un fil va d'un nœud à l'autre par « trace »
# (points intermédiaires), en segments à 0, 45 ou 90°.
folio: 2a
titre: Distribution de servitude et tableau Scheiber
aria: "Distribution proposée : une barrette positive après le coupe-circuit de servitude alimente le guindeau, le tableau de la table à carte par un fusible de 50 A et le tableau Scheiber par un fusible de 30 A. La pompe de cale automatique est alimentée en direct depuis la batterie par un fusible de 10 A et renvoie sa masse côté batteries."
desc: "Une seule barrette + remplace les deux départs sans protection (A1, A6). Chaque départ a son fusible, placé à la source du câble qu'il protège. La pompe de cale ne dépend plus d'aucun coupe-circuit : ni pour son positif, ni pour sa masse. Ses deux fusibles passent à 3 A, le calibre du fabricant (A10)."
modele: A-H1
taille: [1200, 720]

appareils:
