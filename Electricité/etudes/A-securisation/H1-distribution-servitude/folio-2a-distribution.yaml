    x: 40
    y: 80
    w: 150
    h: 80
    titre: Batterie servitude
    lignes: [110 Ah · Pb]
    nodes:
      node007: [droite, 130]
      node008: [gauche, 130]
  - id: cc-servitude
    forme: interrupteur
    titre: CC servitude +
    titre_xy: [330, 102]
    nodes:
