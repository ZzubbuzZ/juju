# yaml-language-server: $schema=../../../outils/schema/nomenclature.schema.json
#
# A-H4 : nomenclature chiffrée. Prix TTC en euros, estimations du 30/09/2026.
# Décision du 30/09 : isolateur maison, sans liaison terre / masse 12 V ;
# différentiel d'arrivée remplacé. Transformateur d'isolement écarté.

hypothese: A-H4
devise: EUR

lots:
  terre:
    titre: Isolateur galvanique maison sur la terre du ponton
    anomalies: [A8]
    note: Précaution tant que la terre n'est pas reliée à la masse 12 V (voir proposition.md).
  differentiel:
    titre: Remplacement du différentiel d'arrivée (Q36)

articles:
  - { lot: terre, designation: "Pont redresseur monophasé en module, 100 A, 1 000 V, IFSM ≥ 1 000 A, bornes à vis", quantite: 2, unite: pièce, prix_unitaire: 15, statut: estimation, note: "Un en place, un de rechange" }
  - { lot: terre, designation: "Radiateur aluminium et pâte thermique", quantite: 1, unite: lot, prix_unitaire: 10, statut: estimation }
  - { lot: terre, designation: "Boîtier étanche IP66 et presse-étoupes", quantite: 1, unite: pièce, prix_unitaire: 12, statut: estimation }
  - { lot: terre, designation: "Câble vert-jaune 2,5 mm², cosses et pont de cuivre entre + et −", quantite: 1, unite: lot, prix_unitaire: 6, statut: estimation, fils: [wire170, wire171] }
  - { lot: differentiel, designation: "Interrupteur différentiel bipolaire 40 A 30 mA type A, modulaire", quantite: 1, unite: pièce, prix_unitaire: 60, statut: estimation }
