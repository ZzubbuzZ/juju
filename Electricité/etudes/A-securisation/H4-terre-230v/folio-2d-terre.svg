<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Arrivée 230 V proposée : la terre de la prise de quai passe par un isolateur galvanique maison avant la barrette de terre, et le différentiel est remplacé par un interrupteur différentiel de type A.">
  <title>Folio 2d · Terre 230 V et différentiel</title>
  <desc>La terre du ponton est conservée, à travers un isolateur galvanique maison placé sur son conducteur ; elle n'est pas reliée à la masse 12 V (Q40). Le différentiel d'arrivée est remplacé par un interrupteur différentiel bipolaire 30 mA de type A.</desc>
  <style>
    /* Style autonome : retiré par outils/page.py quand le folio est intégré à la page HTML. */
    svg{--sheet:#fbfcfd;--ink:#18212b;--muted:#5a6776;--pos:#c8231c;--unk:#1f6fbf;--warn:#e58a00;--on-warn:#1a1206;--new:#1d8a4a;--new-soft:#e2f3e8;--zone:#e8edf2;--ph:#8a5a2b;--ne:#2563c4;--pe:#2f9e44;--pey:#e6b800}
    @media (prefers-color-scheme: dark){svg{--sheet:#151b22;--ink:#e3e8ee;--muted:#93a1b0;--pos:#ff5a4f;--unk:#5aa9f5;--warn:#ffa53d;--new:#4fcf85;--new-soft:#15301f;--zone:#1f2832;--ph:#c8915a;--ne:#6aa7ff;--pe:#51cf66;--pey:#ffd43b}}
    .bg{fill:var(--sheet)}
    text{font-family:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",sans-serif;fill:var(--ink)}
    .t{font-size:12.5px}.tb{font-size:13px;font-weight:600}.ts{font-size:11.5px;fill:var(--muted)}
    .id,.idn,.pin{font-family:"IBM Plex Mono",Consolas,monospace}
    .id{font-size:10.5px;fill:var(--muted)}.idn{font-size:10.5px;fill:var(--new)}.pin{font-size:8.5px;fill:var(--ink)}
    .tu{fill:var(--unk)}.tn{fill:var(--new)}.mid{text-anchor:middle}.end{text-anchor:end}
    .p,.n,.u,.lever,.bound,.ph,.ne,.pe,.pey,.leader{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .p{stroke:var(--pos)}.n{stroke:var(--ink)}
    .ph{stroke:var(--ph)}.ne{stroke:var(--ne)}.pe{stroke:var(--pe)}.pey{stroke:var(--pey);stroke-dasharray:6 6;stroke-linecap:butt}
    .u{stroke:var(--unk);stroke-width:1.6;stroke-dasharray:6 4}
    .bound{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 4}
    .w1{stroke-width:1.3}.w2{stroke-width:2}.w3{stroke-width:2.8}.w4{stroke-width:4}.w5{stroke-width:5.5}
    .box{fill:var(--sheet);stroke:var(--ink);stroke-width:1.4}
    .box-new{fill:var(--new-soft);stroke:var(--new);stroke-width:1.6}
    .box-unk{fill:var(--sheet);stroke:var(--unk);stroke-width:1.5;stroke-dasharray:6 4}
    .fuse{fill:var(--sheet);stroke:var(--ink);stroke-width:1.3}
    .fuse-new{fill:var(--new-soft);stroke:var(--new);stroke-width:1.6}
    .dp{fill:var(--pos)}.dn{fill:var(--ink)}
    .term{fill:var(--sheet);stroke:var(--ink);stroke-width:1.4}
    .lever{stroke:var(--ink);stroke-width:2}
    .flag{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
    .flag-new{fill:var(--new-soft);stroke:var(--new);stroke-width:1.4}
    .hull{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
    .zone{fill:var(--zone);stroke:var(--muted);stroke-width:1}
    .zone-pont{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .leader{stroke:var(--muted);stroke-width:1}
    .callout{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
    .mk-a circle{fill:var(--warn)}
    .mk-a text{fill:var(--on-warn);font-family:"IBM Plex Mono",Consolas,monospace;font-size:9.5px;font-weight:500}
    .mk-q circle{fill:var(--sheet);stroke:var(--unk);stroke-width:1.5}
    .mk-q text{fill:var(--unk);font-family:"IBM Plex Mono",Consolas,monospace;font-size:9.5px;font-weight:500}
  </style>
  <rect class="bg" x="0" y="0" width="100%" height="100%"/>

  <!-- ============ Prise de quai ============ -->
  <rect class="box" x="40" y="110" width="140" height="150" rx="2"/>
  <text class="tb mid" x="110" y="134">Prise de quai</text>
  <text class="ts mid" x="110" y="151">EU · banc tribord</text>
  <text class="id end" x="174" y="176">node203</text>
  <text class="id end" x="174" y="206">node204</text>
  <text class="id end" x="174" y="246">node205</text>

  <!-- Phase et neutre, inchangés -->
  <path class="ph w2" d="M180 180 H440"/>
  <path class="ne w2" d="M180 210 H440"/>
  <text class="id mid" x="300" y="173">wire029 · phase</text>
  <text class="id mid" x="300" y="203">wire030 · neutre</text>

  <!-- Différentiel remplacé -->
  <rect class="box-new" x="440" y="160" width="170" height="70" rx="2"/>
  <text class="tb mid tn" x="525" y="184">Interrupteur différentiel</text>
  <text class="ts mid tn" x="525" y="201">30 mA · type A · 40 A</text>
  <text class="ts mid" x="525" y="218">remplace le Power Safe (Q36)</text>
  <text class="id end" x="436" y="176">n206</text>
  <text class="id end" x="436" y="206">n207</text>
  <text class="id" x="614" y="194">n208</text>
  <path class="ph w2" d="M610 180 H720"/>
  <path class="ne w2" d="M610 210 H720"/>
  <text class="id mid" x="665" y="173">wire031 · wire037</text>
  <rect class="flag" x="720" y="170" width="270" height="50"/>
  <text class="ts mid" x="855" y="199">disjoncteurs 10 A (n210) et 16 A (n213) : folio 3</text>

  <!-- Terre du ponton, à travers l'isolateur -->
  <path class="pe w2" d="M180 250 H300"/><path class="pey w2" d="M180 250 H300"/>
  <text class="idn mid" x="240" y="243">wire170 · 2,5</text>
  <rect class="box-new" x="300" y="232" width="120" height="36" rx="2"/>
  <text class="tb mid tn" x="360" y="248">Isolateur</text>
  <text class="ts mid tn" x="360" y="262">galvanique maison</text>
  <g class="mk-a"><circle cx="420" cy="232" r="10"/><text class="mid" x="420" y="235.5">A8</text></g>
  <text class="id mid" x="300" y="284">node256</text>
  <text class="id mid" x="420" y="284">node257</text>
  <path class="pe w2" d="M420 250 H720"/><path class="pey w2" d="M420 250 H720"/>
  <text class="idn mid" x="490" y="243">wire171 · 2,5</text>
  <circle class="dn" cx="720" cy="250" r="4"/>
  <text class="id end" x="712" y="243">node212</text>
  <text class="ts" x="730" y="254">barrette de terre du boîtier d'arrivée</text>
  <text class="ts" x="730" y="270">vers chargeur et prises : folio 3</text>

  <!-- Masse 12 V : pas de liaison -->
  <path class="u" d="M720 254 V300 H845 V330"/>
  <rect class="box-unk" x="760" y="330" width="170" height="40" rx="2"/>
  <text class="tb mid" x="845" y="348">Masse 12 V (node005)</text>
  <text class="ts mid" x="845" y="363">non reliée à la terre</text>
  <g class="mk-q"><circle cx="930" cy="330" r="11"/><text class="mid" x="930" y="333.5">Q40</text></g>

  <!-- Détail de l'isolateur -->
  <rect class="box" x="40" y="320" width="640" height="132" rx="2"/>
  <text class="tb" x="54" y="342">Isolateur maison : un pont redresseur monophasé en module</text>
  <text class="t" x="54" y="362">100 A, 1 000 V au moins, IFSM ≥ 1 000 A ; bornes + et − reliées par un pont de cuivre ;</text>
  <text class="t" x="54" y="380">les deux bornes « ~ » deviennent les bornes de l'isolateur (deux diodes en série dans chaque sens).</text>
  <text class="t" x="54" y="398">Sur radiateur, dans un boîtier étanche près de la prise de quai.</text>
  <text class="t" x="54" y="422">Contrôle chaque saison, câble de quai débranché : 0,9 à 1,2 V dans les deux sens.</text>
  <text class="t" x="54" y="438">« OL » = diode ouverte, la terre ne passe plus : ne plus brancher au quai.</text>

  <!-- Légende -->
  <text class="ts" x="40" y="484">En vert : nouveau. Phase, neutre et terre sont dessinés conducteur par conducteur (multifilaire).</text>
  <text class="ts" x="40" y="502">L'ancien fil de terre de la prise vers la barrette est remplacé par wire170, l'isolateur et wire171.</text>
</svg>
