  <text class="pin" x="447" y="189">phase</text>
  <text class="idn" x="447" y="209">n207</text>
  <text class="pin" x="447" y="219">neutre</text>
  <text class="idn end" x="693" y="179">n208</text>
  <text class="pin end" x="693" y="189">phase</text>
  <text class="idn end" x="693" y="209">n209</text>
  <text class="pin end" x="693" y="219">neutre</text>
  <text class="idn" x="277" y="289">n256</text>
  <text class="pin" x="277" y="299">~ côté quai</text>
  <text class="idn end" x="503" y="289">n257</text>
  <text class="pin end" x="503" y="299">~ côté bord</text>
  <text class="id end" x="714" y="282">n212</text>
  <text class="ts mid" x="980" y="213">neutres → chargeur (n201), boîtier tribord (n221) : folio 3</text>
  <text class="ts" x="730" y="294">barrette de terre du boîtier d&#x27;arrivée</text>
  <text class="ts" x="730" y="310">vers chargeur et prises : folio 3</text>
  <text class="tb" x="54" y="372">Isolateur maison : un pont redresseur monophasé en module</text>
  <text class="t" x="54" y="392">100 A, 1 000 V au moins, IFSM ≥ 1 000 A ; bornes + et − reliées par un pont de cuivre ;</text>
  <text class="t" x="54" y="410">les deux bornes « ~ » deviennent les bornes de l&#x27;isolateur (deux diodes en série dans chaque sens).</text>
  <text class="t" x="54" y="428">Sur radiateur, dans un boîtier étanche près de la prise de quai.</text>
  <text class="t" x="54" y="452">Contrôle chaque saison, câble de quai débranché : 0,9 à 1,2 V dans les deux sens.</text>
  <text class="t" x="54" y="468">« OL » = diode ouverte, la terre ne passe plus : ne plus brancher au quai.</text>
  <text class="ts" x="40" y="514">En vert : nouveau. Phase, neutre et terre sont dessinés conducteur par conducteur (multifilaire).</text>
  <text class="ts" x="40" y="532">L&#x27;ancien fil de terre de la prise vers la barrette est remplacé par w170, l&#x27;isolateur et w171.</text>
  <g class="mk-a"><circle cx="510" cy="262" r="11"/><text class="mid" x="510" y="265.5">A8</text></g>
  <g class="mk-q"><circle cx="930" cy="350" r="11"/><text class="mid" x="930" y="353.5">Q40</text></g>
