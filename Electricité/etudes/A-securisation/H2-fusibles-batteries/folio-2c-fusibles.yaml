      node085: {cote: point, xy: [806, 380], etiquette: [4, 20]}
  - id: disj-guindeau
    x: 960
    y: 405
    w: 220
    h: 50
    titre: Disj. guindeau
    titre_y: 18
    lignes: ["vers le guindeau : folio 1"]
    nodes:
