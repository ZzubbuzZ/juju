# Mise en page du folio 2c, lue par outils/folio.py qui produit le SVG voisin.
# Nœuds : [côté, coordonnée le long du côté] ; un fil va d'un nœud à l'autre par « trace »
# (points intermédiaires), en segments à 0, 45 ou 90°.
folio: 2c
titre: Fusibles de batterie et des départs
aria: "Fusibles proposés : un fusible de 400 A près de chaque batterie, un fusible sur chacun des quatre départs du coupleur et du chargeur, et un fusible à la source de chacun des câbles des deux tableaux."
desc: "Chaque câble branché sur une batterie est désormais protégé à sa source : 400 A près des batteries (A2), 30 A pour le chargeur et 40 A pour le coupleur (A4), 50 A pour le tableau de la table à carte (A1), 30 A pour le tableau Scheiber (A6). Les câbles existants sont conservés et repris sur les porte-fusibles."
modele: A-H2
taille: [1200, 700]

appareils:
  # --- Batterie moteur -------------------------------------------------------------
  - id: bat-moteur
    x: 40
    y: 90
    w: 150
    h: 70
    titre: Batterie moteur
    lignes: [110 Ah · coffre tribord]
    nodes:
      node001: [droite, 140]
  - id: fus-bat-moteur
    forme: fusible
    calibre: 400 A
    titre: MEGA
    titre_xy: [288, 166]
    nodes:
      node070: {cote: point, xy: [260, 140], etiquette: [-4, 22, end]}
      node071: {cote: point, xy: [316, 140], etiquette: [4, 22]}
  - id: cc-moteur
    forme: interrupteur
    titre: CC moteur
    titre_xy: [454, 112]
    nodes:
      node003: {cote: point, xy: [424, 140], etiquette: [-4, 20, end]}
      node004: {cote: point, xy: [484, 140], etiquette: [4, 20]}
  - id: fus-chargeur-moteur
    forme: fusible
    calibre: 30 A
    nodes:
      node074: {cote: point, xy: [500, 210], etiquette: [-4, 20, end]}
      node075: {cote: point, xy: [546, 210], etiquette: [4, 20]}
  - id: fus-coupleur-moteur
    forme: fusible
    calibre: 40 A
    nodes:
      node078: {cote: point, xy: [500, 250], etiquette: [-4, 20, end]}
      node079: {cote: point, xy: [546, 250], etiquette: [4, 20]}

  # --- Batterie de servitude -------------------------------------------------------
  - id: bat-servitude
    x: 40
    y: 380
    w: 150
    h: 70
    titre: Batterie servitude
    lignes: [110 Ah · cabine de poupe]
    nodes:
      node007: [droite, 430]
  - id: fus-bat-servitude
    forme: fusible
    calibre: 400 A
    titre: MEGA
    titre_xy: [288, 456]
    nodes:
      node072: {cote: point, xy: [260, 430], etiquette: [-4, 22, end]}
      node073: {cote: point, xy: [316, 430], etiquette: [4, 22]}
  - id: cc-servitude
    forme: interrupteur
    titre: CC servitude
    titre_xy: [476, 402]
    titre_ancre: end
    nodes:
      node009: {cote: point, xy: [424, 430], etiquette: [-4, 20, end]}
      node010: {cote: point, xy: [484, 430], etiquette: [4, 20]}
  - id: fus-chargeur-servitude
    forme: fusible
    calibre: 30 A
    nodes:
      node076: {cote: point, xy: [500, 510], etiquette: [-4, 20, end]}
      node077: {cote: point, xy: [546, 510], etiquette: [4, 20]}
