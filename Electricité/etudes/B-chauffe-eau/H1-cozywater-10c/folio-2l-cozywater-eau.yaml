# Mise en page du folio 2l, lue par outils/folio.py qui produit le SVG voisin.
# Circuit d'eau, sans fil électrique : appareils sans nœuds, tuyauteries en traits libres
# (plein : eau froide ; tirets : eau chaude, vidange ; pointillés : flexible).
folio: 2l
titre: Chauffe-eau CozyWater 10C, circuit d'eau
aria: "Circuit d'eau douce du chauffe-eau : pompe, réducteur à 1,5 bar pour tout le circuit, robinets d'eau froide, vanne d'arrêt, vase d'expansion de 1 litre, soupape de 3 bars, ballon CozyWater 10C, vanne d'arrêt et mitigeurs."
desc: "Le réducteur, à la sortie de la pompe, met l'eau froide et l'eau chaude à 1,5 bar quelle que soit la coupure de la pompe. Le vase de 1 L, gonflé à 1,4 bar, absorbe la dilatation de l'eau chaude sous la soupape de 3 bar."
modele: B-H1
taille: [1200, 600]

zones:
