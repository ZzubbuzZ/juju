  - {x: 40, y: 425, classe: t, texte: "1. Réducteur réglé au maximum : son manomètre suit la pompe. Noter coupure et redémarrage sur une dizaine de cycles."}
  - {x: 60, y: 442, texte: "Coupure la plus basse ≥ 2 bar : consigne 1,5 bar · entre 1,7 et 2 bar : consigne 1,2 bar, vase à 1,1 bar · plus bas : réparer la pompe d'abord."}
  - {x: 40, y: 468, classe: t, texte: "2. Vase gonflé à la consigne moins 0,1 bar (1,4 bar), circuit sans pression : pompe coupée, un robinet ouvert."}
  - {x: 40, y: 492, classe: t, texte: "3. Réducteur réglé à 1,5 bar, lu au repos après un puisage."}
  - {x: 40, y: 516, classe: t, texte: "4. Remplir et purger le ballon : soupape fermée (levier horizontal), robinet sur chaud ouvert jusqu'à l'eau sans air."}
  - {x: 40, y: 540, classe: t, texte: "5. Essai : chauffer à 75 °C robinets fermés. Attendu ≈ 2,0 bar à 60 °C, ≈ 2,4 bar à 75 °C ; la soupape ne goutte pas."}
  - {x: 60, y: 562, texte: "Au-delà de 2,7 bar : regonfler le vase, vérifier qu'aucun clapet ne l'isole du ballon. Ne pas toucher à la vis du bypass de la pompe (notice)."}
