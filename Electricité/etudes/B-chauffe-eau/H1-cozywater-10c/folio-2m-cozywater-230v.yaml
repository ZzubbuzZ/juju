# Mise en page du folio 2m (B-H1), lue par outils/folio.py qui produit le SVG voisin.
# Unifilaire comme le folio 3 : un câble = un trait (cables:), ses conducteurs cités dans l'étiquette.
# Neutre (node321) et terre (node322) partent des barrettes du boîtier tribord avec la phase du second C10 :
# une barre de longueur nulle les porte au départ du câble ; de même pour la fiche du ballon dans sa prise.
folio: 2m
titre: Chauffe-eau CozyWater 10C, alimentation
aria: "Alimentation 230 volts du chauffe-eau : second disjoncteur de 10 ampères du boîtier tribord, câble de 3 fois 1,5 millimètres carrés vers une prise dédiée, cordon du ballon à fiche Schuko ; entrée 12 volts au folio 2n."
desc: "Le ballon se branche par sa fiche Schuko, intacte, sur une prise dédiée alimentée seule par le C10 n°2 du boîtier tribord, en aval du différentiel 30 mA. Le C10 n°2 est libéré en transférant son câble, l'éclairage bâbord, sur le C10 n°1, qui alimente alors tout l'éclairage (Q42, affectation supposée). Le câble passe par une boîte de dérivation. Unifilaire, comme le folio 3 ; l'entrée 12 V, câblée elle aussi, est au folio 2n ; le 230 V est prioritaire."
modele: B-H1
taille: [1200, 560]

zones:
  - {x: 60, y: 160, w: 660, h: 140, texte: "Boîtier de distribution tribord · cabinet de toilette · Legrand DNX3"}

appareils:
  # --- Amont ------------------------------------------------------------------------------
  - id: boitier-arrivee
    x: 40
    y: 60
    w: 190
    h: 80
    titre: Boîtier d'arrivée
    lignes: [différentiel 30 mA, sans disjoncteur (A12)]
    nodes:
      node308: {cote: droite, a: 125, fonction: "P / N / PE"}
      node309: [droite, 125]
      node307: [droite, 125]

  # --- Boîtier tribord ---------------------------------------------------------------------
  - id: boitier-230-tribord
    forme: barre      # barres de phase, de neutre et de terre (barres: ci-dessous)
    nodes:
      node320: {cote: point, xy: [440, 200], etiquette: [-6, 18, end], fonction: "P / N / PE"}
      node321: {cote: point, xy: [440, 200]}
      node322: {cote: point, xy: [440, 200]}
  - id: disj-trib-eclairage
    forme: fusible
    calibre: 10 A
    calibre_cote: gauche
    titre: tout l'éclairage
    titre_xy: [152, 219]
    titre_ancre: ""
    nodes:
      node323: {cote: point, xy: [140, 200], etiquette: [5, -6]}
      node324: {cote: point, xy: [140, 230], etiquette: [6, 14]}
  - id: disj-trib-10a-2
    forme: fusible
    calibre: 10 A
    titre: ballon
    titre_xy: [298, 219]
    titre_ancre: ""
    nodes:
      node328: {cote: point, xy: [260, 200], etiquette: [5, -6]}
      node329: {cote: point, xy: [260, 230], etiquette: [6, 14]}
  - id: disj-trib-prises
    forme: fusible
    calibre: 16 A
    calibre_cote: gauche
    titre: prises tribord
    titre_xy: [542, 219]
    titre_ancre: ""
    nodes:
      node339: {cote: point, xy: [530, 200], etiquette: [5, -6]}
      node340: {cote: point, xy: [530, 230], etiquette: [6, 14]}
  - id: disj-babord-prises
    forme: fusible
    calibre: 16 A
    calibre_cote: gauche
    titre: bâbord
    titre_xy: [672, 219]
    titre_ancre: ""
    nodes:
      node352: {cote: point, xy: [660, 200], etiquette: [5, -6]}
      node353: {cote: point, xy: [660, 230], etiquette: [6, 14]}

  # --- Prise dédiée et ballon ---------------------------------------------------------------
  - id: prise-230-ballon
    x: 420
    y: 440
    w: 140
    h: 72
    titre: Prise dédiée
    titre_y: 18
    lignes: [PC 16 A · Schuko]
    nodes:
      node333: {cote: gauche, a: 490, fonction: "P / N / PE"}
      node334: [gauche, 490]
      node335: [gauche, 490]
  - id: chauffe-eau
    x: 720
    y: 390
    w: 220
    h: 120
    rx: 10
    titre: CozyWater 10C
    lignes: ["230 V · 800 W · 3,5 A", "12 V · 200 W (B-H3)", "circuit d'eau : folio 2l"]
    nodes:
      node336: {cote: gauche, a: 490, fonction: "P / N / PE"}
      node337: [gauche, 490]
      node338: [gauche, 490]
  - id: panneau-commande
    nouveau: true
    x: 745
    y: 250
    w: 170
    h: 50
    titre: Panneau de commande
    lignes: [fourni · minuterie]

barres:
  - {node: node320, de: [100, 200], a: [690, 200], classe: n}
  - {node: node321, de: [100, 200], a: [690, 200], classe: n}
