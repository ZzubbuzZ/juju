  - {node: node322, de: [260, 230], a: [260, 230], classe: n, epaisseur: w2}
  # fiche Schuko du ballon dans la prise dédiée
  - {node: node333, de: [560, 490], a: [560, 490], classe: n, epaisseur: w2}
  - {node: node334, de: [560, 490], a: [560, 490], classe: n, epaisseur: w2}
  - {node: node335, de: [560, 490], a: [560, 490], classe: n, epaisseur: w2}

