# yaml-language-server: $schema=../../../outils/schema/donnees.schema.json
#
# B-H1 : différences avec le relevé. Décision du 07/10 (Q56) : le ballon se branche sur une prise
# dédiée, posée près du boîtier de distribution tribord et alimentée seule par le second C10 du
# boîtier. La notice du ballon interdit de couper sa fiche Schuko.
# 12/10 : les deux C10 sont occupés (Q42). L'utilisateur regroupe leurs deux câbles sur un seul C10
# et libère l'autre pour le ballon ; le câble neuf passe par une boîte de dérivation (sans nœud
# propre : la plage node300-319 est pleine).
# Nœuds 300 à 319 réservés à l'étude B ; fils wire300 et suivants.
# Ballon posé sous la table à carte (12/10) ; câble de 5 m estimé depuis le boîtier tribord (cabinet de toilette).

hypothese: B-H1
titre: Ballon Carbest CozyWater 10C sur le 230 V, prise dédiée
base: releve

equipements:
  - { id: prise-230-ballon, type: prise, designation: "Prise 230 V dédiée au ballon, 16 A avec terre, compatible Schuko (fiche hybride)", zone: table-a-carte, emplacement: "Sous la table à carte, à moins de 2 m du ballon (longueur du cordon)", statut: propose }
  - { id: chauffe-eau, type: recepteur, designation: "Chauffe-eau Carbest CozyWater 10C (entrée 230 V)", modele: "670604, 10 L, 230 V 800 W et 12 V 200 W", zone: table-a-carte, emplacement: "Sous la table à carte, posé le 12/10", puissance_W: 800, courant_A: 3.5, statut: propose, note: "Entrée 12 V non raccordée ici : B-H3" }

nodes:
  # --- C10 libéré du boîtier tribord (son câble actuel est regroupé sur l'autre C10, Q42) ---
  - { id: node306, equipement: disj-trib-10a-2, borne: "entrée", polarite: 230V-phase, monte_sur: node220, questions: [Q42] }
  - { id: node307, equipement: disj-trib-10a-2, borne: "sortie", polarite: 230V-phase, questions: [Q42] }

  # --- Prise dédiée -----------------------------------------------------------------
  - { id: node300, equipement: prise-230-ballon, borne: "phase", polarite: 230V-phase }
  - { id: node301, equipement: prise-230-ballon, borne: "neutre", polarite: 230V-neutre }
  - { id: node302, equipement: prise-230-ballon, borne: "terre", polarite: 230V-terre }

  # --- Ballon -----------------------------------------------------------------------
  - { id: node303, equipement: chauffe-eau, borne: "230 V phase", polarite: 230V-phase }
  - { id: node304, equipement: chauffe-eau, borne: "230 V neutre", polarite: 230V-neutre }
  - { id: node305, equipement: chauffe-eau, borne: "230 V terre", polarite: 230V-terre }

fils:
  # --- Câble 3 × 1,5 mm² du second C10 à la prise dédiée -----------------------------
  - { id: wire300, de: node307, vers: node300, section_mm2: 1.5, couleur: marron, longueur_m: 5, statut: propose, note: "Câble H07RN-F 3G1,5 ; protégé par le C10. Passe par une boîte de dérivation (12/10). Longueur estimée", questions: [Q42] }
  - { id: wire301, de: node221, vers: node301, section_mm2: 1.5, couleur: bleu, longueur_m: 5, statut: propose }
  - { id: wire302, de: node222, vers: node302, section_mm2: 1.5, couleur: vert-jaune, longueur_m: 5, statut: propose }

  # --- Cordon du ballon, fourni, fiche Schuko (à ne pas modifier) -----------------------
  - { id: wire303, de: node300, vers: node303, statut: propose, note: "Cordon du ballon, 2 m, fiche Schuko (13/10)" }
  - { id: wire304, de: node301, vers: node304, statut: propose }
  - { id: wire305, de: node302, vers: node305, statut: propose }
