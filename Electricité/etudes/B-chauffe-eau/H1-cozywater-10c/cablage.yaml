# yaml-language-server: $schema=../../../outils/schema/donnees.schema.json
#
# B-H1 : différences avec le relevé. Décision du 07/10 (Q56) : le ballon se branche sur une prise
# dédiée, posée près du boîtier de distribution tribord et alimentée seule par le second C10 du
# boîtier. La notice du ballon interdit de couper sa fiche Schuko.
# 12/10 : les deux C10 sont occupés (Q42). L'utilisateur regroupe leurs deux câbles sur un seul C10
# et libère l'autre pour le ballon ; le câble neuf passe par une boîte de dérivation, sans nœud propre.
# Ballon posé sous la table à carte (12/10) ; câble de 5 m estimé depuis le boîtier tribord (cabinet de toilette).
# 15/10 : le relevé affecte (supposé) le C10 n°1 à l'éclairage tribord et le C10 n°2 à l'éclairage bâbord,
# avec leurs nœuds (node328, node329). Le câble de l'éclairage bâbord (wire331) passe sur le C10 n°1 ;
# le C10 n°2 libéré alimente le ballon.

hypothese: B-H1
titre: Ballon Carbest CozyWater 10C sur le 230 V, prise dédiée
base: releve

supprime:
  fils: [wire331]

equipements:
  - { id: prise-230-ballon, type: prise, designation: "Prise 230 V dédiée au ballon, 16 A avec terre, compatible Schuko (fiche hybride)", zone: table-a-carte, emplacement: "Sous la table à carte, à moins de 2 m du ballon (longueur du cordon)", statut: propose }
  - { id: chauffe-eau, type: recepteur, designation: "Chauffe-eau Carbest CozyWater 10C (entrée 230 V)", modele: "670604, 10 L, 230 V 800 W et 12 V 200 W", zone: table-a-carte, emplacement: "Sous la table à carte, posé le 12/10", puissance_W: 800, courant_A: 3.5, statut: propose, note: "Entrée 12 V non raccordée ici : B-H3" }

nodes:
  # --- Prise dédiée -----------------------------------------------------------------
  - { id: node333, equipement: prise-230-ballon, borne: "phase", polarite: 230V-phase }
  - { id: node334, equipement: prise-230-ballon, borne: "neutre", polarite: 230V-neutre }
  - { id: node335, equipement: prise-230-ballon, borne: "terre", polarite: 230V-terre }

  # --- Ballon -----------------------------------------------------------------------
  - { id: node336, equipement: chauffe-eau, borne: "230 V phase", polarite: 230V-phase }
  - { id: node337, equipement: chauffe-eau, borne: "230 V neutre", polarite: 230V-neutre }
  - { id: node338, equipement: chauffe-eau, borne: "230 V terre", polarite: 230V-terre }

fils:
  # --- Transfert de l'éclairage bâbord du C10 n°2 sur le C10 n°1 (libère le C10 n°2) -------
  - { id: wire331, de: node324, vers: node330, section_mm2: 1.5, statut: propose, questions: [Q42], note: "Câble de l'éclairage bâbord, débranché du C10 n°2 (node329) et repris sur le C10 n°1 (node324), qui alimente alors tout l'éclairage 230 V (0,4 A environ). Affectation des C10 supposée (15/10)" }

  # --- Câble 3 × 1,5 mm² du second C10 à la prise dédiée -----------------------------
  - { id: wire334, de: node329, vers: node333, section_mm2: 1.5, couleur: marron, longueur_m: 5, statut: propose, note: "Câble H07RN-F 3G1,5 ; protégé par le C10. Passe par une boîte de dérivation (12/10). Longueur estimée", questions: [Q42] }
  - { id: wire335, de: node321, vers: node334, section_mm2: 1.5, couleur: bleu, longueur_m: 5, statut: propose }
  - { id: wire336, de: node322, vers: node335, section_mm2: 1.5, couleur: vert-jaune, longueur_m: 5, statut: propose }

  # --- Cordon du ballon, fourni, fiche Schuko (à ne pas modifier) -----------------------
  - { id: wire337, de: node333, vers: node336, statut: propose, note: "Cordon du ballon, 2 m, fiche Schuko (13/10)" }
  - { id: wire338, de: node334, vers: node337, statut: propose }
  - { id: wire339, de: node335, vers: node338, statut: propose }
