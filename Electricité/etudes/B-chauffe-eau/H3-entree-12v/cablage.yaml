# yaml-language-server: $schema=../../../outils/schema/donnees.schema.json
#
# B-H3 : différences avec B-H1 (ballon CozyWater 10C sur le 230 V). Retenue le 08/10/2026.
# Les deux entrées restent câblées en permanence ; le ballon choisit seul le 230 V quand il est là.
# Notice, page 67 : interrupteur et relais de 30 A sur le +, fusible de 30 A au plus près de la
# source, 6 mm² au moins. Décision du 12/10 : ni relais ni interrupteur ; un disjoncteur 12 V CC de
# 30 A à commande manuelle, à la platine, protège le câble et sert d'interrupteur.
# Départ du + côté charges du coupe-circuit de servitude (node021) : le coupe-circuit coupe aussi
# le ballon. Retour du − sur node023, côté « bord » du shunt (D-H1, E-H1) : la consommation est
# comptée. node021 et node023 sont inchangés par les études A, D et E.
# Ballon sous la table à carte (12/10). Trajet du 6 mm² (13/10) : le long du bord bâbord jusqu'aux coffres de la
# cabine de poupe, à travers eux jusqu'à la batterie de servitude, puis au disjoncteur, à côté de celui du guindeau (Q57).
# Nœuds node175, node176, node177, node178 ; ceux du relais et de sa commande ont été supprimés le 12/10.
# Longueurs estimées (Q57).

hypothese: B-H3
titre: Entrée 12 V du ballon, câblée en permanence, coupée au disjoncteur
base: B-H1

equipements:
  - { id: disj-ballon-12v, type: disjoncteur, designation: "Disjoncteur 12 V CC de l'entrée 12 V du ballon, à commande manuelle : protection et interrupteur « ballon sur batterie » (12/10)", calibre_A: 30, emplacement: "À côté du disjoncteur du guindeau, sous l'ouverture d'accès aux coupe-circuits (cabine de poupe), 13/10", statut: propose, note: "Calibre imposé par la notice ; protège le câble de 6 mm². Disjoncteur prévu pour le courant continu et pour servir d'interrupteur (12/10) ; remplace le fusible, le relais et l'interrupteur à voyant de la notice" }

nodes:
  # --- Disjoncteur 12 V CC de 30 A à la platine (12/10 : remplace le fusible) ---------
  - { id: node175, equipement: disj-ballon-12v, borne: "1 (côté source)", polarite: "+" }
  - { id: node176, equipement: disj-ballon-12v, borne: "2", polarite: "+" }

  # --- Ballon, entrée 12 V ------------------------------------------------------------
  - { id: node177, equipement: chauffe-eau, borne: "12 V +", polarite: "+" }
  - { id: node178, equipement: chauffe-eau, borne: "12 V −", polarite: "-" }

fils:
  # --- Puissance : 6 mm², environ 17 A --------------------------------------------------
  - { id: wire154, de: node021, vers: node175, section_mm2: 6, couleur: rouge, longueur_m: 0.5, statut: propose, note: "Liaison courte de la platine au disjoncteur, placé à côté de celui du guindeau (13/10) ; protégée seulement par le MEGA de 300 A : la plus courte possible, gainée et bridée" }
  - { id: wire173, de: node176, vers: node177, section_mm2: 6, couleur: rouge, longueur_m: 3, statut: propose, questions: [Q57], note: "Disjoncteur → ballon, par le bord bâbord et les coffres de la cabine de poupe (13/10) ; longueur estimée, sans doute plus de 3 m (Q57). À 5 m, chute de tension d'environ 4 %" }
  - { id: wire161, de: node178, vers: node023, section_mm2: 6, couleur: noir, longueur_m: 3, statut: propose, questions: [Q57], note: "Côté « bord » du shunt : la consommation du ballon est comptée" }

