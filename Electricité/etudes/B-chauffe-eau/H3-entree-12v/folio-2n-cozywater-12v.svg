  <text class="ts" x="20" y="512">En vert : nouveau. Le ballon choisit seul le 230 V quand il est présent ; le disjoncteur, fermé, autorise la chauffe sur la batterie (environ 45 Ah par chauffe).</text>
  <text class="ts" x="20" y="530">Sans relais ni interrupteur à voyant (12/10) : aucune consommation au repos. Le − revient côté « bord » du shunt : la consommation du ballon est comptée.</text>
