<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 545" role="img" aria-label="Entrée 12 volts du chauffe-eau : fusible de 30 ampères côté charges du coupe-circuit de servitude, câble de 6 millimètres carrés jusqu&#x27;à un relais de 30 ampères près du ballon, commandé par un interrupteur à voyant protégé par un fusible de 1 ampère ; retour du négatif côté bord du shunt.">
  <title>Folio 2n · Chauffe-eau CozyWater 10C, entrée 12 V</title>
  <desc>L&#x27;entrée 12 V du ballon reste câblée en permanence à côté du 230 V, qui est prioritaire. Un fusible de 30 A à la platine, du 6 mm² et un relais de 30 A commandé par un interrupteur à voyant près du ballon, comme le demande la notice.</desc>
