<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 545" role="img" aria-label="Entrée 12 volts du chauffe-eau : disjoncteur 12 volts continu de 30 ampères à commande manuelle côté charges du coupe-circuit de servitude, câble de 6 millimètres carrés jusqu&#x27;au ballon ; retour du négatif côté bord du shunt.">
  <title>Folio 2n · Chauffe-eau CozyWater 10C, entrée 12 V</title>
  <desc>L&#x27;entrée 12 V du ballon reste câblée en permanence à côté du 230 V, qui est prioritaire. Un disjoncteur 12 V CC de 30 A à commande manuelle, à la platine, protège le 6 mm² et sert d&#x27;interrupteur « ballon sur batterie » ; il remplace le fusible, le relais et l&#x27;interrupteur à voyant de la notice (12/10).</desc>
