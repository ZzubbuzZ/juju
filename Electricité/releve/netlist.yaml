# yaml-language-server: $schema=../outils/schema/donnees.schema.json
#
# Nœuds du circuit : une borne d'un équipement = un nœud.
# Plages de numéros : 001-019 batteries et charge, 020-039 guindeau et moteur,
# 040-049 frigo, 050-059 tableau Scheiber 2 voies et pompe de cale, 060-099 réservé
# aux propositions, 100-199 tableau de servitude,
# 200-299 réseau 230 V (sauf node047-048 de l'EPS 100, numérotés avant la création de cette plage).

nodes:
  # --- Batterie moteur et coupe-circuit moteur ---------------------------------
  - { id: node001, equipement: bat-moteur, borne: "+", polarite: "+" }
  - { id: node002, equipement: bat-moteur, borne: "-", polarite: "-" }
  - { id: node003, equipement: cc-moteur, borne: "1 (côté batterie)", polarite: "+" }
  - { id: node004, equipement: cc-moteur, borne: "2 (côté charges)", polarite: "+" }

  # --- Coupe-circuit des négatifs ------------------------------------------------
  - { id: node005, equipement: cc-masse, borne: "1 (côté batteries)", polarite: "-" }
  - { id: node006, equipement: cc-masse, borne: "2 (côté charges)", polarite: "-" }

  # --- Batterie de servitude et coupe-circuits -----------------------------------
  - { id: node007, equipement: bat-servitude, borne: "+", polarite: "+" }
  - { id: node008, equipement: bat-servitude, borne: "-", polarite: "-" }
  - { id: node009, equipement: cc-servitude, borne: "1 (côté batterie)", polarite: "+" }
  - { id: node010, equipement: cc-servitude, borne: "2 (côté charges)", polarite: "+" }
  - { id: node011, equipement: cc-couplage, borne: "1 (côté servitude)", polarite: "+" }
  - { id: node012, equipement: cc-couplage, borne: "2 (côté moteur)", polarite: "+" }

  # --- Coupleur et chargeur ------------------------------------------------------
  - { id: node013, equipement: coupleur, borne: "batterie moteur", polarite: "+" }
  - { id: node014, equipement: coupleur, borne: "batterie servitude", polarite: "+" }
  - { id: node015, equipement: coupleur, borne: "masse", polarite: "-" }
  - { id: node016, equipement: chargeur-quai, borne: "sortie 1 (moteur)", polarite: "+" }
  - { id: node017, equipement: chargeur-quai, borne: "sortie 2 (servitude)", polarite: "+" }
  - { id: node018, equipement: chargeur-quai, borne: "masse", polarite: "-" }

  # --- Guindeau ------------------------------------------------------------------
  - { id: node020, equipement: disj-guindeau, borne: "1 (primaire)", polarite: "+" }
  - { id: node021, equipement: disj-guindeau, borne: "2 (secondaire)", polarite: "+" }
  - { id: node022, equipement: relais-guindeau, borne: "entrée +", polarite: "+" }
  - { id: node023, equipement: relais-guindeau, borne: "entrée -", polarite: "-" }
  - { id: node024, equipement: relais-guindeau, borne: "sortie moteur A", polarite: commute }
  - { id: node025, equipement: relais-guindeau, borne: "sortie moteur B", polarite: commute }
  - { id: node026, equipement: relais-guindeau, borne: "commande montée", polarite: commande }
  - { id: node027, equipement: relais-guindeau, borne: "commande descente", polarite: commande }
  - { id: node028, equipement: relais-guindeau, borne: "commande masse", polarite: "-" }
  - { id: node029, equipement: guindeau, borne: "A", polarite: commute }
  - { id: node030, equipement: guindeau, borne: "B", polarite: commute }
  - { id: node033, equipement: fus-telecommande-guindeau, borne: "1", polarite: "+" }
  - { id: node034, equipement: fus-telecommande-guindeau, borne: "2", polarite: "+" }
  - { id: node035, equipement: telecommande-guindeau, borne: "+", polarite: "+" }
  - { id: node036, equipement: telecommande-guindeau, borne: "montée", polarite: commande }
  - { id: node037, equipement: telecommande-guindeau, borne: "descente", polarite: commande }

  # --- Moteur --------------------------------------------------------------------
  - { id: node031, equipement: moteur, borne: "+ démarreur / alternateur", polarite: "+", questions: [Q1, Q14] }
  - { id: node032, equipement: moteur, borne: "masse moteur", polarite: "-" }

  # --- Frigo ---------------------------------------------------------------------
  - { id: node040, equipement: groupe-froid, borne: "+ 12/24 V", polarite: "+" }
  - { id: node041, equipement: groupe-froid, borne: "-", polarite: "-" }
  - { id: node042, equipement: eps100, borne: "batterie +", polarite: "+" }
  - { id: node043, equipement: eps100, borne: "batterie -", polarite: "-" }
  - { id: node044, equipement: eps100, borne: "sortie groupe froid +", polarite: "+" }
  - { id: node045, equipement: eps100, borne: "sortie groupe froid -", polarite: "-" }
  # node046 (terre 230 V de l'EPS 100) supprimé le 29/09 : l'EPS 100 n'a pas de terre. Numéro à ne pas réutiliser.
  - { id: node047, equipement: eps100, borne: "230 V phase", polarite: 230V-phase }
  - { id: node048, equipement: eps100, borne: "230 V neutre", polarite: 230V-neutre }

  # --- Tableau Scheiber 2 voies et pompe de cale ---------------------------------
  - { id: node050, equipement: tableau-scheiber, borne: "+ alimentation", polarite: "+" }
  - { id: node051, equipement: tableau-scheiber, borne: "- masse", polarite: "-" }
  - { id: node052, equipement: tableau-scheiber, borne: "sortie frigo (15 A)", polarite: "+" }
  - { id: node053, equipement: tableau-scheiber, borne: "sortie pompe de cale (10 A)", polarite: "+" }
  - { id: node056, equipement: pompe-cale, borne: "+", polarite: "+" }
  - { id: node057, equipement: pompe-cale, borne: "-", polarite: "-" }

  # --- Tableau de servitude (table à carte) --------------------------------------
  - { id: node100, equipement: tableau-servitude, borne: "+ alimentation", polarite: "+" }
  - { id: node101, equipement: tableau-servitude, borne: "- barre de masse", polarite: "-" }
  - { id: node102, equipement: tableau-servitude, borne: "feu route (10 A)", polarite: "+" }
  - { id: node103, equipement: tableau-servitude, borne: "feu moteur (10 A)", polarite: "+" }
  - { id: node104, equipement: tableau-servitude, borne: "pompe à eau (15 A)", polarite: "+" }
  - { id: node105, equipement: tableau-servitude, borne: "radio (10 A)", polarite: "+" }
  - { id: node106, equipement: tableau-servitude, borne: "prises 12 V (10 A)", polarite: "+" }
  - { id: node107, equipement: tableau-servitude, borne: "éclairage (10 A)", polarite: "+" }
  - { id: node108, equipement: tableau-servitude, borne: "projecteur (10 A)", polarite: "+" }
  - { id: node109, equipement: tableau-servitude, borne: "mouillage (10 A)", polarite: "+" }
  - { id: node110, equipement: tableau-servitude, borne: "compas (5 A)", polarite: "+" }
  - { id: node111, equipement: tableau-servitude, borne: "pilote (10 A)", polarite: "+" }
  - { id: node112, equipement: tableau-servitude, borne: "VHF (10 A)", polarite: "+" }
  - { id: node113, equipement: tableau-servitude, borne: "GPS loch (10 A)", polarite: "+" }

  # --- Réseau 230 V --------------------------------------------------------------
  - { id: node200, equipement: chargeur-quai, borne: "230 V phase", polarite: 230V-phase }
  - { id: node201, equipement: chargeur-quai, borne: "230 V neutre", polarite: 230V-neutre }
