# yaml-language-server: $schema=../outils/schema/donnees.schema.json
#
# Nœuds du circuit : une borne d'un équipement = un nœud.
# Numérotation par section (15/10), commune aux nœuds et aux fils : 001-049 batteries, coupe-circuits
# et shunt ; 050-099 charge ; 100-149 moteur et guindeau ; 150-199 distribution 12 V (départs, Scheiber,
# frigo, ballon) ; 200-249 tableau de servitude et ses circuits ; 300-399 réseau 230 V. Un fil prend la
# section de son bout le plus en aval. Relevé et propositions partagent les sections (champ statut).

nodes:
  # --- Batterie moteur et coupe-circuit moteur ---------------------------------
  - { id: node001, equipement: bat-moteur, borne: "+", polarite: "+" }
  - { id: node002, equipement: bat-moteur, borne: "-", polarite: "-" }
  - { id: node005, equipement: cc-moteur, borne: "1 (côté batterie)", polarite: "+" }
  - { id: node006, equipement: cc-moteur, borne: "2 (côté charges)", polarite: "+" }

  # --- Coupe-circuit des négatifs ------------------------------------------------
  - { id: node022, equipement: cc-masse, borne: "1 (côté batteries)", polarite: "-" }
  - { id: node023, equipement: cc-masse, borne: "2 (côté charges)", polarite: "-" }

  # --- Batterie de servitude et coupe-circuits -----------------------------------
  - { id: node007, equipement: bat-servitude, borne: "+", polarite: "+" }
  - { id: node008, equipement: bat-servitude, borne: "-", polarite: "-" }
  - { id: node020, equipement: cc-servitude, borne: "1 (côté batterie)", polarite: "+" }
  - { id: node021, equipement: cc-servitude, borne: "2 (côté charges)", polarite: "+" }
