  - { id: node206, equipement: ddr-230v, borne: "entrée phase", polarite: 230V-phase }
  - { id: node207, equipement: ddr-230v, borne: "entrée neutre", polarite: 230V-neutre }
  - { id: node208, equipement: ddr-230v, borne: "sortie phase", polarite: 230V-phase }
  - { id: node209, equipement: ddr-230v, borne: "sortie neutre", polarite: 230V-neutre }
  - { id: node210, equipement: disj-chargeur, borne: "entrée", polarite: 230V-phase }
