# yaml-language-server: $schema=../outils/schema/donnees.schema.json
#
# Équipements électriques constatés à bord.
# Ce fichier ne contient que l'existant : les propositions vont dans etudes/.
# statut absent = relevé à bord.

equipements:
  # --- Stockage et coupure ---------------------------------------------------
  - id: bat-moteur
    type: batterie
    designation: Batterie moteur
    modele: Varta 110 Ah plomb sans entretien
    zone: cockpit-coffre-tribord
    emplacement: Contre la paroi du cabinet de toilette
    capacite_Ah: 110
    technologie: plomb
    note: Câbles sans cosses serties, abîmés par le connecteur actuel (anomalie A3).

  - id: bat-servitude
    type: batterie
    designation: Batterie de servitude
    modele: 110 Ah plomb sans entretien
    zone: cabine-poupe
    emplacement: Dans un coffre sous le matelas de la cabine de poupe, au sol, contre le coffre moteur. Local peu aéré (01/10)
    capacite_Ah: 110
    technologie: plomb
    note: L'hydrogène dégagé pendant la charge peut s'accumuler dans le coffre et la cabine (anomalie A11).

  - id: cc-moteur
    type: coupe-circuit
    designation: Coupe-circuit + moteur
    zone: descente
    emplacement: Platine sur une contremarche, en haut à droite. Connectique accessible par une ouverture côté cabine de poupe

  - id: cc-servitude
    type: coupe-circuit
    designation: Coupe-circuit + servitude
    zone: descente
    emplacement: Platine sur une contremarche, en bas à droite. Connectique accessible par une ouverture côté cabine de poupe

  - id: cc-masse
    type: coupe-circuit
    designation: Coupe-circuit des négatifs (commun aux deux batteries)
    zone: descente
    emplacement: Platine sur une contremarche, en haut à gauche. Connectique accessible par une ouverture côté cabine de poupe

  - id: cc-couplage
    type: coupe-circuit
    designation: Coupe-circuit de couplage (servitude vers démarreur/alternateur)
    zone: descente
    emplacement: Platine sur une contremarche, en bas à gauche. Connectique accessible par une ouverture côté cabine de poupe

  # --- Charge ------------------------------------------------------------------
  - id: coupleur
    type: coupleur
    designation: Coupleur de charge à relais
    modele: Scheiber 38.14700.00
    zone: descente
    emplacement: Derrière la platine des coupe-circuits, accessible par l'ouverture côté cabine de poupe
    note: Prévu pour plomb uniquement. Sa masse est prise côté charges du coupe-circuit des négatifs. Relais donné pour 40 A (30/09).

  - id: chargeur-quai
    type: chargeur
    designation: Chargeur de quai
    modele: Dolphin 12 V 20 A, 3 sorties plomb (REYA DOLBB.1220)
    zone: cockpit-coffre-tribord
    emplacement: Au-dessus de la batterie moteur
    note: "Sortie 3 libre. Branché en direct sur les batteries, sans passer par les coupe-circuits. Alimenté en 230 V par le disjoncteur 10 A du boîtier voisin. Notice (documentation/MANUAL-DOLBB-1210-1220-299519-299520.pdf) : 3 sorties dites « isolées », un négatif commun (-DC) ; fusible interne F25A côté batteries, T6A côté secteur ; câbles batterie préconisés 6 mm², 1,5 m au plus ; borne PE à raccorder à la terre ; boîtier en aluminium."

  - id: moteur
    type: moteur
    designation: Moteur Yanmar (démarreur + alternateur)
    modele: Yanmar 3GMD (plaque signalétique)
    zone: compartiment-moteur
    note: "L'état des lieux initial indiquait 3GM30. Refroidissement direct à l'eau de mer. Alternateur de 20 A, sans borne W (13/10). Démarreur (manuel d'atelier Yanmar) : 60 A à vide, 460 A rotor bloqué, puissance maximale entre 200 et 275 A. Tableau moteur (contact, jauges) alimenté par le faisceau d'origine depuis le + du démarreur, à travers un fusible de 30 A (13/10) ; fusible de rechange à acheter. Accouplement de l'arbre d'hélice métallique, sans câble de masse sur le tube d'étambot (13/10) : arbre et hélice sont à la masse 12 V."

  - id: tableau-moteur
    type: tableau
    designation: Tableau moteur (contact, jauges)
    questions: [Q65]
    note: "Alimenté par le faisceau d'origine Yanmar depuis le + du démarreur (node100), à travers un fusible de 30 A (Q1, 13/10). Masse et emplacement non relevés (Q65)."

  - id: fus-tableau-moteur
    type: fusible
    designation: Fusible du faisceau du tableau moteur
    calibre_A: 30
    questions: [Q65]
    note: "Porte-fusible du faisceau d'origine (Q1, 13/10) ; type de fusible et emplacement à relever, un fusible de rechange à acheter."

  # --- Guindeau ----------------------------------------------------------------
  - id: disj-guindeau
    type: disjoncteur
    designation: Disjoncteur thermique du guindeau
    zone: cabine-poupe
    emplacement: Sous l'ouverture d'accès aux coupe-circuits
    calibre_A: 70
    note: Calibre conforme à la notice Lewmar (tableau 7.5) du Pro-Series 1000.

  - id: relais-guindeau
    type: relais
    designation: Boîtier relais du guindeau
    zone: cabine-proue
    emplacement: Boîtier de type boîte de dérivation près du guindeau, accessible depuis la cabine de proue

  - id: guindeau
    type: recepteur
    designation: Guindeau
    modele: Lewmar Pro-Series 1000
    zone: pont-avant
    emplacement: Posé sur le pont, au-dessus du puits de chaîne
    puissance_W: 700
    courant_A: 50
    note: "Notice Lewmar (tableau 7.5) : courant normal 50 A, disjoncteur 70 A, charge de travail 114 kg, traction maximale 454 kg, fils de commande 1,5 mm²."

  - id: fus-telecommande-guindeau
    type: fusible
    designation: Fusible de la télécommande du guindeau
    calibre_A: 5
    note: Pris sur le + d'entrée du relais du guindeau.

  - id: telecommande-guindeau
    type: commande
    designation: Télécommande du guindeau
    note: Alimentée par le + d'entrée du relais du guindeau, à travers un fusible de 5 A.

  # --- Tableaux ----------------------------------------------------------------
  - id: tableau-servitude
    type: tableau
    designation: Tableau de servitude (table à carte)
    zone: table-a-carte
    note: 12 interrupteurs et 12 fusibles. Câblage arrière en « plat de spaghettis ».

  - id: tableau-scheiber
    type: tableau
    designation: Tableau Scheiber 2 voies (frigo 15 A, pompe de cale 10 A)
    zone: descente
    emplacement: Contremarche, près de l'appareillage moteur
    note: Alimenté par les coupe-circuits voisins.

  # --- Récepteurs --------------------------------------------------------------
  - id: groupe-froid
    type: recepteur
    designation: Groupe froid
    modele: WAECO ColdMachine CU-55 12/24 V
    zone: cuisine
    emplacement: Meuble bas sous l'évier, partie droite
    puissance_W: 40
    courant_A: 3.5
    courant_max_A: 5
    statut: estime

  - id: eps100
    type: convertisseur
    designation: Alimentation 12 V / 230 V du frigo
    modele: Dometic EPS 100
    zone: cuisine
    emplacement: Meuble bas sous l'évier, partie droite, à côté du groupe froid
    note: "Bornes à vis d'environ 8 mm de large, prévues pour des cosses à fourche SV 2-4 (fils de 1,5 à 2,5 mm², AWG 16-14). Non relié à la terre : son cordon 230 V se termine par une fiche à deux contacts (29/09)."

  - id: pompe-cale
    type: recepteur
    designation: Pompe de cale moteur
    modele: Attwood Tsunami T500 (réf. 4606 / 4640)
    zone: compartiment-moteur
    emplacement: Cale moteur
    note: Pompe électrique sans flotteur, mise en route manuelle depuis le tableau Scheiber. Fusible recommandé par le fabricant 3 A, protégée en 10 A (anomalie A10).

  - id: pompe-eau
    type: recepteur
    designation: Pompe à eau douce
    modele: Seaflo SFDP1-045-040
    zone: cockpit-coffre-tribord
    courant_A: 8
    courant_max_A: 15
    statut: estime
    note: "Seaflo série 41, pompe à membrane à 4 chambres, 4,5 gal/min (17 L/min), pressostat et bypass. La coupure à 40 psi (2,8 bar) vient de la référence (-040), la notice ne donne ni la coupure ni le redémarrage ; coupure jugée variable par l'utilisateur (07/10). Notice (documentation/SEAFLO-Notice-pompe-41-series-SFDP1-045-040.pdf) : circuit dédié, fusible de 30 A, tuyaux de 19 mm à l'aspiration et au refoulement, 10 mm au moins vers les robinets, filtre à l'aspiration, clapet éventuel ouvrant à 2 psi au plus, vis du bypass à ne pas régler soi-même."

  - id: feu-bicolore
    type: recepteur
    designation: Feu bicolore (proue)
    puissance_W: 25
    statut: estime
    note: Incandescent.

  - id: feu-poupe
    type: recepteur
    designation: Feu de poupe
    puissance_W: 10
    statut: estime
    note: Incandescent.

  - id: feu-tete-mat
    type: recepteur
    designation: Feu de tête de mât (moteur)
    puissance_W: 25
    statut: estime
    note: Incandescent.

  - id: feu-mouillage
    type: recepteur
    designation: Feu de mouillage
    puissance_W: 2
    statut: estime
    note: LED. Puissance estimée pour un feu de mouillage à LED.

  - id: projecteur
    type: recepteur
    designation: Projecteur de pont
    puissance_W: 35
    statut: estime
    note: Incandescent.

  - id: eclairage
    type: recepteur
    designation: Éclairage intérieur 12 V (7 luminaires)
    courant_A: 5
    statut: estime
    note: "Circuit « éclairage » (10 A) du tableau de servitude. Luminaires relevés le 12/10, un par ligne ci-dessous (eclairage-12v-…) : six à LED, un à incandescence (cabine de poupe). Chaque luminaire a son interrupteur ; câblage historique, trajet non relevé (13/10). Courant estimé avant ce relevé."

  - id: eclairage-12v-poupe
    type: recepteur
    designation: Luminaire 12 V de la cabine de poupe
    zone: cabine-poupe
    note: "Deux ampoules à culot G11 de 1 W (15/10), notées à incandescence le 12/10 : 1 W correspond plutôt à des LED."

  - id: eclairage-12v-table-a-carte
    type: recepteur
    designation: Plafonnier 12 V de la table à carte
    zone: table-a-carte
    note: LED (12/10).

  - id: eclairage-12v-proue
    type: recepteur
    designation: Luminaire 12 V de la cabine de proue
    zone: cabine-proue
    note: Deux ampoules à culot G11 à LED (12/10), de 1 W chacune (15/10).

  - id: eclairage-12v-carre
    type: recepteur
    designation: Plafonnier 12 V du carré
    zone: carre
    note: LED (12/10).

  - id: eclairage-12v-veilleuse-carre
    type: recepteur
    designation: Veilleuse 12 V du carré
    zone: carre
    note: LED (12/10).

  - id: eclairage-12v-cuisine
    type: recepteur
    designation: Plafonnier 12 V de la cuisine (cambuse)
    zone: cuisine
    note: LED (12/10).

  - id: eclairage-12v-toilette
    type: recepteur
    designation: Plafonnier 12 V du cabinet de toilette
    zone: cabinet-toilette
    emplacement: Au-dessus de l'évier
    note: LED (12/10).

  - id: prises-12v
    type: recepteur
    designation: Prises 12 V allume-cigare (x2)
    zone: table-a-carte
    emplacement: Au tableau de servitude, de part et d'autre de l'indicateur de charge
    courant_max_A: 10

  - id: autoradio
    type: recepteur
    designation: Autoradio
    courant_A: 5
    statut: estime
    questions: [Q8]

  - id: compas
    type: recepteur
    designation: Éclairage du compas
    courant_A: 0.1
    statut: estime

  - id: pilote
    type: recepteur
    designation: Pilote automatique de barre franche
    modele: Raymarine ST2000+
    courant_max_A: 5
    statut: estime

  - id: vhf
    type: recepteur
    designation: VHF
    modele: Standard Horizon Matrix GX2200 AIS
    courant_max_A: 6
    statut: estime

  - id: gps
    type: recepteur
    designation: GPS traceur (sondeur intégré ?)
    modele: Garmin GPSMAP 7407 xsv ou xdv
    courant_A: 2
    statut: estime
    questions: [Q11]

  - id: repetiteur-gps
    type: recepteur
    designation: Répétiteur GPS
    modele: MLR FX312
    zone: table-a-carte
    emplacement: Unité principale à la table à carte ; écran déporté au-dessus de la descente, côté cockpit

  - id: loch
    type: recepteur
    designation: Loch

  - id: anemometre
    type: recepteur
    designation: Anémomètre / girouette
    modele: Advansea

  - id: radar
    type: recepteur
    designation: Radar
    questions: [Q11]

  # --- Réseau 230 V ------------------------------------------------------------
  - id: prise-quai
    type: prise
    designation: Prise de quai (norme EU)
    zone: cockpit-coffre-tribord
    emplacement: Sous le banc tribord du cockpit

  - id: boitier-230v
    type: tableau
    designation: Boîtier d'arrivée 230 V
    zone: cockpit-coffre-tribord
    emplacement: À côté du chargeur de quai
    note: "Différentiel 30 mA / 25 A en tête, puis un disjoncteur 10 A (chargeur). Le reste du bord (boîtier tribord) part directement de la sortie du différentiel, sans disjoncteur (correction du 15/10 : le disjoncteur 16 A relevé le 28/09 n'existe pas, A12). Une place libre sur le rail (Q63, 12/10)."

  - id: ddr-230v
    type: disjoncteur
    designation: Disjoncteur différentiel 30 mA
    modele: Power Safe ID55225
    zone: cockpit-coffre-tribord
    emplacement: Dans le boîtier 230 V du chargeur
    calibre_A: 25
    note: Aucune documentation trouvée (30/09). Type (AC ou A) inconnu ; le préfixe ID évoque un interrupteur différentiel, sans protection contre les surintensités.

  - id: disj-chargeur
    type: disjoncteur
    designation: Disjoncteur du chargeur de quai
    modele: Merlin Gerin DT40 C10, phase + neutre
    zone: cockpit-coffre-tribord
    emplacement: Dans le boîtier 230 V du chargeur
    calibre_A: 10

  - id: boitier-230-tribord
    type: tableau
    designation: Boîtier de distribution 230 V tribord
    zone: cabinet-toilette
    emplacement: Dans le cabinet de toilette (correction du 01/10, noté auparavant sur la cloison du coffre de cockpit)
    questions: [Q42]
    note: "Quatre disjoncteurs Legrand DNX3 phase + neutre, numérotés 1 à 4 sur l'étiquette, sans affectation écrite (photo Boitier-230v-cabinet-toilette.jpg, 01/10) : C10, C10, C16, C16. Circuits connus : éclairage (10 A), prises tribord et prises bâbord (16 A). Le second 10 A est utilisé (12/10) ; son circuit et la position de chaque circuit sont à relever (Q42)."

  - id: disj-trib-eclairage
    type: disjoncteur
    designation: Disjoncteur éclairage 230 V tribord (C10 n°1, à gauche)
    modele: Legrand DNX3 C10, phase + neutre
    calibre_A: 10
    questions: [Q42]
    note: "Un seul câble de 1,5 mm² en part (12/10). Éclairage tribord : affectation supposée par l'utilisateur (15/10, Q42)."

  - id: disj-trib-prises
    type: disjoncteur
    designation: Disjoncteur prises 230 V tribord
    modele: Legrand DNX3 C16, phase + neutre
    calibre_A: 16

  - id: disj-trib-10a-2
    type: disjoncteur
    designation: Disjoncteur éclairage 230 V bâbord (C10 n°2, à droite)
    modele: Legrand DNX3 C10, phase + neutre
    emplacement: Dans le boîtier de distribution tribord
    calibre_A: 10
    questions: [Q42]
    note: "Vu sur la photo du 01/10. Utilisé (12/10) : un seul câble de 1,5 mm² en part. Éclairage bâbord : affectation supposée par l'utilisateur (15/10, Q42)."

  - id: disj-babord-prises
    type: disjoncteur
    designation: Disjoncteur prises 230 V bâbord
    modele: Legrand DNX3 C16, phase + neutre
    emplacement: Dans le boîtier de distribution tribord
    calibre_A: 16

  - id: boitier-230-babord
    type: bornier
    designation: Boîte de dérivation 230 V bâbord
    zone: table-a-carte
    emplacement: À l'arrière gauche de la table à carte
    note: Simple boîte de dérivation, sans disjoncteur, alimentée par le disjoncteur 16 A bâbord du boîtier tribord (30/09).

  - id: prise-230-eps100
    type: prise
    designation: Prise 230 V du frigo (EPS 100)
    zone: cuisine

  - id: prise-230-cuisine
    type: prise
    designation: Prise 230 V de la cuisine
    zone: cuisine
    emplacement: À tribord (12/10)

  - id: plafonnier-230
    type: recepteur
    designation: Éclairage 230 V tribord (circuit du C10 n°1)
    statut: estime
    questions: [Q42, Q60]
    note: "Circuit du disjoncteur éclairage (10 A) du boîtier tribord, noté « plafonnier 230 V » jusqu'au 12/10 ; ses nœuds (node325-327) représentent le départ du circuit, qui ne passe pas par les boîtes de dérivation (réservées aux prises, 13/10). Luminaires relevés le 12/10, un par ligne ci-dessous (eclairage-230-…) : quatre spots à LED GU10, une réglette dans le carré et un plafonnier barrette dans la cuisine. Le plafonnier métallique noté le 30/09 était une erreur (13/10) : présence d'une terre et matière des luminaires à relever (Q60)."

  - id: eclairage-230-babord
    type: recepteur
    designation: Éclairage 230 V bâbord (circuit du C10 n°2)
    statut: estime
    questions: [Q42, Q60]
    note: "Départ du second C10, supposé alimenter l'éclairage bâbord (15/10, Q42) ; ses nœuds (node330-332) représentent le départ du circuit. Répartition des six luminaires entre les deux circuits non relevée."

  - id: eclairage-230-poupe
    type: recepteur
    designation: Spot 230 V de la cabine de poupe
    zone: cabine-poupe
    note: Spot à LED, culot GU10 (12/10).
    questions: [Q60]

  - id: eclairage-230-table-a-carte
    type: recepteur
    designation: Spot 230 V de la table à carte
    zone: table-a-carte
    note: Spot à LED, culot GU10 (12/10).
    questions: [Q60]

  - id: eclairage-230-proue
    type: recepteur
    designation: Spot 230 V de la cabine de proue
    zone: cabine-proue
    note: Spot à LED, culot GU10 (12/10).
    questions: [Q60]

  - id: eclairage-230-carre
    type: recepteur
    designation: Réglette 230 V du carré
    zone: carre
    note: Barrette à deux spots (12/10). Le « plafonnier 230 V métallique » relevé le 30/09 était cette réglette (correction du 13/10).
    questions: [Q60]

  - id: eclairage-230-cuisine
    type: recepteur
    designation: Plafonnier barrette 230 V de la cuisine (cambuse)
    zone: cuisine
    note: Barrette à deux spots (12/10).
    questions: [Q60]

  - id: eclairage-230-toilette
    type: recepteur
    designation: Spot 230 V du cabinet de toilette
    zone: cabinet-toilette
    note: Spot à LED, culot GU10 (12/10).
    questions: [Q60]

  - id: prise-230-table-a-carte
    type: prise
    designation: Prise 230 V de la table à carte
    zone: table-a-carte

  - id: prise-230-armoire
    type: prise
    designation: Prise 230 V de la cabine de poupe, derrière l'armoire
    zone: cabine-poupe
    emplacement: Derrière l'armoire, qui est derrière la table à carte
    note: Notée « prise du carré » jusqu'au 29/09, puis « prise de l'armoire derrière la table à carte » ; placée dans la cabine de poupe le 12/10.

  - id: prise-230-proue
    type: prise
    designation: Prise 230 V de la cabine de proue
    zone: cabine-proue
    note: Relevée le 12/10. Alimentée par la boîte de dérivation bâbord (13/10).

  - id: prise-230-toilette
    type: prise
    designation: Prise 230 V du cabinet de toilette
    zone: cabinet-toilette

  # --- Instruments -------------------------------------------------------------
  - id: indicateur-charge
    type: recepteur
    designation: Indicateur de charge à aiguille (« CHARGE »)
    zone: table-a-carte
    emplacement: Au tableau de servitude, entre les deux prises 12 V
    note: Emplacement prévu pour l'afficheur du moniteur de batterie (étude D, Q28) ; place suffisante (Q41, 03/10).
