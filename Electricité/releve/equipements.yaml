# yaml-language-server: $schema=../outils/schema/donnees.schema.json
#
# Équipements électriques constatés à bord.
# Ce fichier ne contient que l'existant : les propositions vont dans etudes/.
# statut absent = relevé à bord.

equipements:
  # --- Stockage et coupure ---------------------------------------------------
  - id: bat-moteur
    type: batterie
    designation: Batterie moteur
    modele: Varta 110 Ah plomb sans entretien
    zone: cockpit-coffre-tribord
    emplacement: Contre la paroi du cabinet de toilette
    capacite_Ah: 110
    technologie: plomb
    note: Câbles sans cosses serties, abîmés par le connecteur actuel (anomalie A3).

  - id: bat-servitude
    type: batterie
    designation: Batterie de servitude
    modele: 110 Ah plomb sans entretien
    zone: cabine-poupe
    emplacement: Dans un coffre, au sol, contre le coffre moteur
    capacite_Ah: 110
    technologie: plomb

  - id: cc-moteur
    type: coupe-circuit
    designation: Coupe-circuit + moteur
    zone: descente
    emplacement: Platine sur une contremarche, en haut à droite. Connectique accessible par une ouverture côté cabine de poupe

  - id: cc-servitude
    type: coupe-circuit
    designation: Coupe-circuit + servitude
    zone: descente
    emplacement: Platine sur une contremarche, en bas à droite. Connectique accessible par une ouverture côté cabine de poupe

  - id: cc-masse
    type: coupe-circuit
    designation: Coupe-circuit des négatifs (commun aux deux batteries)
    zone: descente
    emplacement: Platine sur une contremarche, en haut à gauche. Connectique accessible par une ouverture côté cabine de poupe

  - id: cc-couplage
    type: coupe-circuit
    designation: Coupe-circuit de couplage (servitude vers démarreur/alternateur)
    zone: descente
    emplacement: Platine sur une contremarche, en bas à gauche. Connectique accessible par une ouverture côté cabine de poupe

  # --- Charge ------------------------------------------------------------------
  - id: coupleur
    type: coupleur
    designation: Coupleur de charge à relais
    modele: Scheiber 38.14700.00
    zone: descente
    emplacement: Derrière la platine des coupe-circuits, accessible par l'ouverture côté cabine de poupe
    note: Prévu pour plomb uniquement. Sa masse est prise côté charges du coupe-circuit des négatifs. Relais donné pour 40 A (30/09).

  - id: chargeur-quai
    type: chargeur
    designation: Chargeur de quai
    modele: Dolphin 12 V 20 A, 3 sorties plomb (REYA DOLBB.1220)
    zone: cockpit-coffre-tribord
    emplacement: Au-dessus de la batterie moteur
    note: "Sortie 3 libre. Branché en direct sur les batteries, sans passer par les coupe-circuits. Alimenté en 230 V par le disjoncteur 10 A du boîtier voisin. Notice (documentation/MANUAL-DOLBB-1210-1220-299519-299520.pdf) : 3 sorties dites « isolées », un négatif commun (-DC) ; fusible interne F25A côté batteries, T6A côté secteur ; câbles batterie préconisés 6 mm², 1,5 m au plus ; borne PE à raccorder à la terre ; boîtier en aluminium."

  - id: moteur
    type: moteur
    designation: Moteur Yanmar (démarreur + alternateur)
    modele: Yanmar 3GMD (plaque signalétique)
    zone: compartiment-moteur
    note: "L'état des lieux initial indiquait 3GM30. Refroidissement direct à l'eau de mer. Alternateur d'environ 20 A (spécification d'origine ; celui de Juju semble plus récent mais semblable). Démarreur (manuel d'atelier Yanmar) : 60 A à vide, 460 A rotor bloqué, puissance maximale entre 200 et 275 A."
    questions: [Q1, Q14]

  # --- Guindeau ----------------------------------------------------------------
  - id: disj-guindeau
    type: disjoncteur
    designation: Disjoncteur thermique du guindeau
    zone: cabine-poupe
    emplacement: Sous l'ouverture d'accès aux coupe-circuits
    calibre_A: 70
    note: Calibre conforme à la notice Lewmar (tableau 7.5) du Pro-Series 1000.

  - id: relais-guindeau
    type: relais
    designation: Boîtier relais du guindeau
    zone: cabine-proue
    emplacement: Boîtier de type boîte de dérivation près du guindeau, accessible depuis la cabine de proue

  - id: guindeau
    type: recepteur
    designation: Guindeau
    modele: Lewmar Pro-Series 1000
    zone: pont-avant
    emplacement: Posé sur le pont, au-dessus du puits de chaîne
    puissance_W: 700
    courant_A: 50
    note: "Notice Lewmar (tableau 7.5) : courant normal 50 A, disjoncteur 70 A, charge de travail 114 kg, traction maximale 454 kg, fils de commande 1,5 mm²."

  - id: fus-telecommande-guindeau
    type: fusible
    designation: Fusible de la télécommande du guindeau
    calibre_A: 5
    note: Pris sur le + d'entrée du relais du guindeau.

  - id: telecommande-guindeau
    type: commande
    designation: Télécommande du guindeau
    note: Alimentée par le + d'entrée du relais du guindeau, à travers un fusible de 5 A.

  # --- Tableaux ----------------------------------------------------------------
  - id: tableau-servitude
    type: tableau
    designation: Tableau de servitude (table à carte)
    zone: table-a-carte
    note: 12 interrupteurs et 12 fusibles. Câblage arrière en « plat de spaghettis ».

  - id: tableau-scheiber
    type: tableau
    designation: Tableau Scheiber 2 voies (frigo 15 A, pompe de cale 10 A)
    zone: descente
    emplacement: Contremarche, près de l'appareillage moteur
    note: Alimenté par les coupe-circuits voisins.

  # --- Récepteurs --------------------------------------------------------------
  - id: groupe-froid
    type: recepteur
    designation: Groupe froid
    modele: WAECO ColdMachine CU-55 12/24 V
    zone: cuisine
    emplacement: Meuble bas sous l'évier, partie droite
    puissance_W: 40
    courant_A: 3.5
    courant_max_A: 5
    statut: estime

  - id: eps100
    type: convertisseur
    designation: Alimentation 12 V / 230 V du frigo
    modele: Dometic EPS 100
    zone: cuisine
    emplacement: Meuble bas sous l'évier, partie droite, à côté du groupe froid
    note: "Bornes à vis d'environ 8 mm de large, prévues pour des cosses à fourche SV 2-4 (fils de 1,5 à 2,5 mm², AWG 16-14). Non relié à la terre : son cordon 230 V se termine par une fiche à deux contacts (29/09)."

  - id: pompe-cale
    type: recepteur
    designation: Pompe de cale moteur
    modele: Attwood Tsunami T500 (réf. 4606 / 4640)
    zone: compartiment-moteur
    emplacement: Cale moteur
    note: Pompe électrique sans flotteur, mise en route manuelle depuis le tableau Scheiber. Fusible recommandé par le fabricant 3 A, protégée en 10 A (anomalie A10).

  - id: pompe-eau
    type: recepteur
    designation: Pompe à eau douce
    modele: Seaflow SFDP1-045-040
    courant_A: 8
    courant_max_A: 15
    statut: estime

  - id: feu-bicolore
    type: recepteur
    designation: Feu bicolore (proue)
    puissance_W: 25
    statut: estime
    note: Incandescent.

  - id: feu-poupe
    type: recepteur
    designation: Feu de poupe
    puissance_W: 10
    statut: estime
    note: Incandescent.

  - id: feu-tete-mat
    type: recepteur
    designation: Feu de tête de mât (moteur)
    puissance_W: 25
    statut: estime
    note: Incandescent.

  - id: feu-mouillage
    type: recepteur
    designation: Feu de mouillage
    puissance_W: 2
    statut: estime
    note: LED. Puissance estimée pour un feu de mouillage à LED.

  - id: projecteur
    type: recepteur
    designation: Projecteur de pont
    puissance_W: 35
    statut: estime
    note: Incandescent.

  - id: eclairage
    type: recepteur
    designation: Éclairage intérieur (5 ou 6 lampes)
    courant_A: 5
    statut: estime
    questions: [Q9]

  - id: prises-12v
    type: recepteur
    designation: Prises 12 V allume-cigare (x2)
    courant_max_A: 10

  - id: autoradio
    type: recepteur
    designation: Autoradio
    courant_A: 5
    statut: estime
    questions: [Q8]

  - id: compas
    type: recepteur
    designation: Éclairage du compas
    courant_A: 0.1
    statut: estime

  - id: pilote
    type: recepteur
    designation: Pilote automatique de barre franche
    modele: Raymarine ST2000+
    courant_max_A: 5
    statut: estime

  - id: vhf
    type: recepteur
    designation: VHF
    modele: Standard Horizon Matrix GX2200 AIS
    courant_max_A: 6
    statut: estime

  - id: gps
    type: recepteur
    designation: GPS traceur (sondeur intégré ?)
    modele: Garmin GPSMAP 7407 xsv ou xdv
    courant_A: 2
    statut: estime
    questions: [Q11]

  - id: repetiteur-gps
    type: recepteur
    designation: Répétiteur GPS
    modele: MLR FX312
    zone: table-a-carte
    emplacement: Unité principale à la table à carte ; écran déporté au-dessus de la descente, côté cockpit

  - id: loch
    type: recepteur
    designation: Loch

  - id: anemometre
    type: recepteur
    designation: Anémomètre / girouette
    modele: Advansea

  - id: radar
    type: recepteur
    designation: Radar
    questions: [Q11]

  # --- Réseau 230 V ------------------------------------------------------------
  - id: prise-quai
    type: prise
    designation: Prise de quai (norme EU)
    zone: cockpit-coffre-tribord
    emplacement: Sous le banc tribord du cockpit

  - id: boitier-230v
    type: tableau
    designation: Boîtier d'arrivée 230 V
    zone: cockpit-coffre-tribord
    emplacement: À côté du chargeur de quai
    note: Différentiel 30 mA / 25 A en tête, puis un disjoncteur 10 A (chargeur) et un disjoncteur 16 A (reste du bord, vers le boîtier tribord).

  - id: ddr-230v
    type: disjoncteur
    designation: Disjoncteur différentiel 30 mA
    modele: Power Safe ID55225
    zone: cockpit-coffre-tribord
    emplacement: Dans le boîtier 230 V du chargeur
    calibre_A: 25
    note: Aucune documentation trouvée (30/09). Type (AC ou A) inconnu ; le préfixe ID évoque un interrupteur différentiel, sans protection contre les surintensités.

  - id: disj-chargeur
    type: disjoncteur
    designation: Disjoncteur du chargeur de quai
    modele: Merlin Gerin DT40 C10, phase + neutre
    zone: cockpit-coffre-tribord
    emplacement: Dans le boîtier 230 V du chargeur
    calibre_A: 10

  - id: disj-230-reste
    type: disjoncteur
    designation: Disjoncteur 16 A du reste du bord
    zone: cockpit-coffre-tribord
    emplacement: Dans le boîtier d'arrivée 230 V
    calibre_A: 16
    questions: [Q31]

  - id: boitier-230-tribord
    type: tableau
    designation: Boîtier de distribution 230 V tribord
    zone: cockpit-coffre-tribord
    emplacement: Sur la cloison entre le cabinet de toilette et le coffre de cockpit
    note: Un disjoncteur 10 A pour l'éclairage et deux 16 A pour les prises, un par bord (30/09).

  - id: disj-trib-eclairage
    type: disjoncteur
    designation: Disjoncteur éclairage 230 V
    modele: Legrand DNX3 C10, phase + neutre
    calibre_A: 10

  - id: disj-trib-prises
    type: disjoncteur
    designation: Disjoncteur prises 230 V tribord
    modele: Legrand DNX3 C16, phase + neutre
    calibre_A: 16

  - id: disj-babord-prises
    type: disjoncteur
    designation: Disjoncteur prises 230 V bâbord
    modele: Legrand DNX3 C16, phase + neutre
    emplacement: Dans le boîtier de distribution tribord
    calibre_A: 16

  - id: boitier-230-babord
    type: bornier
    designation: Boîte de dérivation 230 V bâbord
    zone: table-a-carte
    emplacement: À l'arrière gauche de la table à carte
    note: Simple boîte de dérivation, sans disjoncteur, alimentée par le disjoncteur 16 A bâbord du boîtier tribord (30/09).

  - id: prise-230-eps100
    type: prise
    designation: Prise 230 V du frigo (EPS 100)
    zone: cuisine

  - id: prise-230-cuisine
    type: prise
    designation: Prise 230 V de la cuisine
    zone: cuisine

  - id: plafonnier-230
    type: recepteur
    designation: Plafonnier 230 V
    note: Terre non raccordée (la terre n'arrive qu'aux prises).
    questions: [Q31]

  - id: prise-230-table-a-carte
    type: prise
    designation: Prise 230 V de la table à carte
    zone: table-a-carte

  - id: prise-230-armoire
    type: prise
    designation: Prise 230 V de l'armoire derrière la table à carte
    zone: table-a-carte
    note: Notée « prise du carré » jusqu'au 29/09.

  - id: prise-230-toilette
    type: prise
    designation: Prise 230 V du cabinet de toilette
    zone: cabinet-toilette

  # --- Instruments -------------------------------------------------------------
  - id: indicateur-charge
    type: recepteur
    designation: Indicateur de charge à aiguille (« CHARGE »)
    zone: table-a-carte
    emplacement: Au tableau de servitude, entre les deux prises 12 V
    note: Emplacement prévu pour l'afficheur du moniteur de batterie (étude D, Q28).
