# yaml-language-server: $schema=../outils/schema/donnees.schema.json
#
# Zones de l'aménagement du Gib'Sea 31, de l'arrière vers l'avant.
# Elles servent à placer les équipements sur le plan d'implantation.
# Plan d'implantation : schemas/folio-0-implantation.svg, d'après photos/gibsea-31-drawing.jpg.

zones:
  - id: cockpit-coffre-tribord
    designation: Coffre de cockpit tribord
    bord: tribord

  - id: cabinet-toilette
    designation: Cabinet de toilette
    bord: tribord
    statut: estime
    note: Côté déduit du coffre de cockpit tribord, dont une paroi donne sur le cabinet de toilette.

  - id: cabine-poupe
    designation: Cabine de poupe
    bord: babord

  - id: compartiment-moteur
    designation: Compartiment moteur
    bord: axe
    note: "Derrière l'escalier de descente, entre le cabinet de toilette et la cabine de poupe. Il chevauche en partie la cabine de poupe, à la hauteur de la batterie de servitude et de la niche d'accès aux coupe-circuits, aux fusibles et à l'Orion XS (15/10)."

  - id: descente
    designation: Descente (escalier d'accès au carré)
    bord: axe
    note: "Niche derrière la contremarche des coupe-circuits (relevé du 14/10) : prisme droit de 26 cm de haut à base trapézoïdale ; face des coupe-circuits 30 cm, face opposée 19 cm, fond perpendiculaire aux deux 45 cm, dont 6 cm occupés par les coupe-circuits. Fenêtre d'accès de 15 × 35 cm dans la face oblique, côté cabine de poupe."

  - id: cuisine
    designation: Cuisine (cambuse)
    bord: tribord
    note: Meuble bas sous l'évier, entre le puits de dérive et la glacière. Appelée « cambuse » dans le relevé de l'éclairage du 12/10.

  - id: table-a-carte
    designation: Table à carte
    bord: babord

  - id: cabine-proue
    designation: Cabine de proue
    bord: axe

  - id: pont-avant
    designation: Pont avant, au-dessus du puits de chaîne
    bord: axe

  - id: carre
    designation: Carré
    bord: axe
